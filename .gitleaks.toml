[extend]
useDefault = true

[allowlist]
description = "False positives: Claude session URLs and HMAC security utilities"
# Claude Code appends session URLs to commit messages; the session ID suffix
# has high entropy and can match generic-api-key rules.
regexTarget = "line"
regexes = [
  '''https://claude\.ai/code/session_[A-Za-z0-9]+''',
]
paths = [
  '''pdv-importados/lib/security/gerenteTokenHmac\.ts''',
]
