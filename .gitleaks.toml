[extend]
useDefault = true

[allowlist]
description = "False positives: placeholder test credentials and Claude session URLs"
# JWT in .env.test is a well-known placeholder (sub=1234567890, role=anon) — not a real credential.
# UUIDs in test files (idempotency keys) match generic-api-key rule but are not secrets.
# Claude Code session URLs in commit trailers match high-entropy token patterns.
regexTarget = "line"
regexes = [
  '''https://claude\.ai/code/session_[A-Za-z0-9]+''',
]
paths = [
  '''pdv-importados/\.env\.test''',
  # Test files cujas chaves de idempotência (UUIDs) casam com generic-api-key.
  # Allowlist por caminho (durável) substitui os fingerprints por SHA em
  # .gitleaksignore, que quebram a cada rebase e deixavam o scan vermelho.
  '''pdv-importados/app/caixa/finalizarVendaValidation\.test\.ts''',
  '''pdv-importados/lib/caixa/resolveVendaIdForFinalize\.test\.ts''',
  '''backend/scripts/fase4-remessa-idempotencia-payload-hash\.test\.sql''',
  # Arquivos deno.lock: hashes de integridade SHA-256 de dependências
  # remotas/npm (formato nativo do lockfile do Deno) — alta entropia, não
  # são segredos. Casam com generic-api-key sempre que uma dependência nova
  # é resolvida; qualquer deno.lock deste repositório pode disparar o mesmo
  # falso positivo estrutural, não é específico de um commit.
  '''deno\.lock''',
]
commits = [
  "3f623524886a0d454d535e4f07a5243fe7f9e1a0",
  "c101d045cda89a5239a5df7315759797031aedc1",
]
