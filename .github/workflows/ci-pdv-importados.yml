# CI pdv-importados — apenas verificação. NÃO faz deploy.
# Deploy de produção: integração nativa da Vercel (GitHub App), acionada por push.
# Gate SSRA: .github/workflows/release-validate.yml (dispara em deployment_status).
# E2E = sistema de risco, não sistema de decisão (e2e-critical não bloqueia nada).
# Produção canônica: https://pdv-importados.vercel.app (projeto Vercel pdv-importados).
# Secrets: CI_NEXT_PUBLIC_*, PLAYWRIGHT_* (e2e-critical assíncrono), SYNC_*, FISCAL_WORKER_KEY.
name: CI pdv-importados

# Cancela execuções obsoletas do mesmo ref. Sem isto, cada commit intermediário
# de uma PR deixa um run completo rodando até o fim mesmo já estando superado —
# principal driver do consumo de minutos que estourou a cota (ver P0-1).
# Em `main` NÃO cancela: um commit que já entrou precisa ser validado até o fim.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege explícito — ver nota em ci-backend-supabase.yml.
permissions:
  contents: read

# Gate de merge: roda em pull_request, que já testa o resultado do merge.
# Não roda em push para `main` — seria revalidar o mesmo código uma segunda vez,
# e o deploy da Vercel não depende deste workflow. O piso de segurança em push
# direto para main é coberto por secret-scan.yml.
on:
  pull_request:
    branches: [main]
    paths:
      - 'pdv-importados/**'
      - 'shared-core/**'
      # Scripts consumidos diretamente pelos jobs de E2E deste workflow
      # (`ci-e2e-readiness-check.mjs`, `ci-supabase-local-start.sh`) — sem
      # este path, um PR que só mudasse um desses arquivos nunca rodaria o
      # E2E, apontado no code review do PR #315: `backend/**` fica de fora do
      # filtro geral (workflow de backend é outro), então um gate de
      # readiness quebrado podia entrar sem ser testado por nenhum workflow.
      - 'backend/scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/ci-pdv-importados.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces na raiz)
        run: npm ci

      - name: Architecture Lock (core rules, PDV flow, routes)
        run: npm run guard:all

      - name: Lint, typecheck e unit tests
        run: npx turbo run lint typecheck test --filter=pdv-importados

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CI_NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CI_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Defina o secret CI_NEXT_PUBLIC_SUPABASE_ANON_KEY em Settings → Secrets and variables → Actions."
            exit 1
          fi
          npx turbo run build --filter=pdv-importados

  # Sistema de risco (não decisão): observa regressão funcional; não entra em needs: do deploy.
  e2e-critical:
    name: E2E crítico (sistema de risco)
    needs: build-and-test
    # A exclusão de forks existia porque o job dependia de secrets, que o
    # GitHub não injeta em PR de fork. Com a stack local o job não consome
    # secret nenhum — então passa a rodar em fork também, que é onde uma
    # regressão funcional tem mais chance de entrar sem ninguém ver.
    runs-on: ubuntu-latest
    # 30 min nao cabia mais. Com a stack local o job ganhou ~8 min de setup
    # (`supabase start` + `db reset`), e no run de 2026-08-19T21:08 os dois
    # jobs de E2E passaram a rodar em paralelo, disputando pull de imagem: o
    # `Install Playwright Chromium`, que normalmente leva ~1 min, ficou 29 min
    # e o job morreu no timeout antes de chegar a testar qualquer coisa.
    #
    # 95, não 60: soma dos `timeout-minutes` de cada step agora chega a ~89min
    # no pior caso (cada um no seu próprio limite) — subiu de ~58min porque
    # "Install Playwright Chromium" (5→35min) e "Readiness" (2→3min) foram
    # corrigidos no code review do PR #315 para cobrir de verdade os piores
    # casos JÁ DOCUMENTADOS acima e no próprio script, em vez de cortar o job
    # bem no meio deles. O timeout do JOB só existe para não cortar um step no
    # meio do seu próprio orçamento — quem detecta e explica uma etapa
    # lenta/travada é o timeout DO STEP, não este.
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces na raiz)
        timeout-minutes: 5
        run: npm ci

      # 35, não 5: o comentário acima do job documenta este MESMO passo levando
      # 29min sob disputa de pull de imagem entre os dois jobs de E2E rodando
      # em paralelo (run de 2026-08-19T21:08) — 5min cortava o job antes de
      # qualquer teste rodar exatamente nesse cenário já observado, o que o
      # code review do PR #315 apontou (P1: o timeout não cobria a duração já
      # documentada acima dele).
      - name: Install Playwright Chromium
        timeout-minutes: 35
        run: npx playwright install --with-deps chromium

      # ─────────────────────────────────────────────────────────────────────
      # Stack Supabase LOCAL e efêmera — substitui o alvo remoto.
      #
      # Antes, este job apontava para um Supabase remoto via secrets
      # PLAYWRIGHT_*. Como não existia homologação, apontava para PRODUÇÃO.
      #
      # A stack local resolve a classe inteira do problema, não só o sintoma:
      #   - impossível poluir produção: o banco nasce e morre dentro do job;
      #   - reproduzível a partir do repositório — `db reset` aplica as
      #     migrations e o seed, então o E2E testa o que está no Git;
      #   - sem `service_role` remota em secret de CI;
      #   - roda em PR de fork, que não recebe secrets.
      #
      # Mesmo script usado pelo job `supabase-local-gates` de
      # `ci-backend-supabase.yml`, onde já roda estável.
      # ─────────────────────────────────────────────────────────────────────
      # `SYNC_KEY` precisa existir ANTES do `supabase start`: o runtime das Edge
      # Functions resolve `[edge_runtime.secrets]` do config.toml no momento em
      # que sobe. Gerar depois nao adianta — foi o que fez `smoke:sync-edge`
      # responder 500 MISSING_SUPABASE_ENV no primeiro run deste PR.
      - name: Gerar SYNC_KEY efêmera (antes do start)
        run: |
          set -euo pipefail
          SYNC_K="$(openssl rand -hex 32)"
          echo "::add-mask::$SYNC_K"
          echo "SYNC_K=$SYNC_K" >> "$GITHUB_ENV"

      - name: Subir Supabase local
        timeout-minutes: 8
        env:
          SYNC_KEY: ${{ env.SYNC_K }}
        run: bash backend/scripts/ci-supabase-local-start.sh

      - name: Reset + seed (migrations do repositório)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          cd backend
          npx supabase db reset --local --yes

      - name: Gerar credenciais efêmeras e gravar .env
        id: localenv
        timeout-minutes: 2
        run: |
          set -euo pipefail
          cd backend
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          cd ..

          SB_URL="${API_URL:-http://127.0.0.1:54321}"
          SB_ANON="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          SB_SR="${SERVICE_ROLE_KEY:-}"
          if [ -z "$SB_ANON" ] || [ -z "$SB_SR" ]; then
            echo "::error::supabase status nao devolveu ANON_KEY/SERVICE_ROLE_KEY." >&2
            exit 1
          fi

          # Segredos de vida curta: existem só enquanto este job existe. Nada
          # aqui pode ser reaproveitado fora da máquina do runner, então não
          # há valor em guardá-los como secret do repositório.
          E2E_PASS="$(openssl rand -base64 24)"
          FISCAL_KEY="$(openssl rand -hex 32)"

          cat > pdv-importados/.env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${SB_URL}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${SB_ANON}
          USE_UNIFIED_SALES_FLOW=true
          STRICT_MANAGER_DISCOUNT_AUTH=true
          AUTO_ENQUEUE_FISCAL_ON_SALE=true
          FISCAL_WORKER_ENDPOINT=${SB_URL}/functions/v1/fiscal-worker
          FISCAL_WORKER_KEY=${FISCAL_KEY}
          EOF

          cat > pdv-local/.env <<EOF
          SYNC_ENDPOINT=${SB_URL}/functions/v1/sync-outbox
          SYNC_KEY=${SYNC_K}
          SUPABASE_ANON_KEY=${SB_ANON}
          NEXT_PUBLIC_SUPABASE_URL=${SB_URL}
          EOF

          # Mascarar antes de exportar: sem isto o log do runner imprime as
          # chaves em claro em qualquer `set -x` ou echo acidental.
          for v in "$SB_ANON" "$SB_SR" "$E2E_PASS" "$FISCAL_KEY"; do
            echo "::add-mask::$v"
          done

          {
            echo "SB_URL=$SB_URL"
            echo "SB_ANON=$SB_ANON"
            echo "SB_SR=$SB_SR"
            echo "E2E_PASS=$E2E_PASS"
            echo "FISCAL_KEY=$FISCAL_KEY"
          } >> "$GITHUB_ENV"

      # ─────────────────────────────────────────────────────────────────────
      # Guard: o E2E NUNCA pode tocar o projeto de produção.
      #
      # Em 2026-08-19 descobrimos que tocava. Os secrets PLAYWRIGHT_* apontavam
      # para `kbabmewnahysfvlybiak`, e cada PR gravava dado real na loja do
      # cliente: 11 vendas de R$ 68,00 só nos runs de #307 e #308, além das
      # lojas `Probe …` / `Smoke Homolog …` e de caixas abandonados que
      # precisaram ser removidos à mão.
      #
      # Agravante: `seed-dev-users.mjs` faz `upsert ... ativo: true`. Desativar
      # as contas de robô à mão não resolvia — o PR seguinte as reativava.
      #
      # Este passo checa o alvo EFETIVO (o que foi resolvido da stack local e
      # escrito nos .env), não os secrets. Checar secrets seria pior que inútil
      # aqui: eles continuam existindo e apontando para produção, então o job
      # reprovaria sempre, por um motivo que já não se aplica.
      #
      # Roda ANTES do seed, que é a primeira escrita de dado do pipeline.
      # ─────────────────────────────────────────────────────────────────────
      - name: Guard — alvo do E2E não pode ser produção
        timeout-minutes: 1
        env:
          PROD_REF: kbabmewnahysfvlybiak
        run: |
          set -euo pipefail
          falhas=()

          case "${SB_URL:-}" in
            *"$PROD_REF"*) falhas+=("SB_URL=$SB_URL") ;;
            http://127.0.0.1:*|http://localhost:*) ;;
            *) falhas+=("SB_URL nao e local: ${SB_URL:-<vazio>}") ;;
          esac

          for arquivo in pdv-importados/.env.local pdv-local/.env; do
            if grep -q "$PROD_REF" "$arquivo" 2>/dev/null; then
              falhas+=("$arquivo referencia o ref de producao")
            fi
          done

          if [ "${#falhas[@]}" -gt 0 ]; then
            for f in "${falhas[@]}"; do
              echo "::error::E2E abortado — alvo invalido: $f"
            done
            echo "::error::O E2E grava vendas, lojas e caixas. Ele so pode rodar contra a stack local efemera."
            exit 1
          fi
          echo "OK — alvo do E2E e a stack local ($SB_URL); nenhuma referencia a producao."

      # Readiness real — não confia em "supabase start" ter retornado sucesso (isso só
      # garante healthcheck do Docker Compose, não que GoTrue/PostgREST já aceitam as
      # chamadas que os testes fazem). Valida Postgres, GoTrue e PostgREST isoladamente,
      # com a MESMA chamada (`admin.auth.admin.listUsers()`) que falhava dentro da suíte —
      # se algum serviço não está saudável, este step falha em segundos com diagnóstico
      # (docker ps/logs/stats), em vez de o job inteiro descobrir isso só depois de vários
      # minutos de setup, no meio de um teste Playwright.
      # 3, não 2: no pior caso, as 6 tentativas (5s cada) + 5 esperas de 2s entre
      # elas já somam ~40s antes de `dumpDiagnostics` sequer começar; os 6
      # comandos de diagnóstico rodando em série a 15s cada somam mais até 90s
      # — ~130s de pior caso contra um limite de 120s cortava a coleta de
      # diagnóstico bem no meio, exatamente o caminho que este script existe
      # para explicar (apontado no code review do PR #315).
      - name: Readiness — Auth/PostgREST/Postgres antes do E2E
        timeout-minutes: 3
        env:
          SB_URL: ${{ env.SB_URL }}
          SB_ANON: ${{ env.SB_ANON }}
          SB_SR: ${{ env.SB_SR }}
        run: node scripts/ci-e2e-readiness-check.mjs
        working-directory: backend

      - name: Seed usuários E2E (banco local)
        timeout-minutes: 2
        env:
          SUPABASE_URL: ${{ env.SB_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SB_SR }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SB_ANON }}
          SEED_DEV_PASSWORD: ${{ env.E2E_PASS }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ env.E2E_PASS }}
          PLAYWRIGHT_CAIXA_TEST_PASSWORD: ${{ env.E2E_PASS }}
          SEED_GERENTE_EMAIL: e2e-gerente@localhost.test
          SEED_OPERADOR_EMAIL: e2e-operador@localhost.test
        run: node pdv-importados/scripts/seed-dev-users.mjs

      - name: Pipeline E2E crítico
        timeout-minutes: 20
        env:
          CI: true
          PLAYWRIGHT_E2E_WITH_DEV: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SB_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SB_ANON }}
          PLAYWRIGHT_TEST_EMAIL: e2e-gerente@localhost.test
          PLAYWRIGHT_TEST_PASSWORD: ${{ env.E2E_PASS }}
          PLAYWRIGHT_CAIXA_TEST_EMAIL: e2e-operador@localhost.test
          PLAYWRIGHT_CAIXA_TEST_PASSWORD: ${{ env.E2E_PASS }}
          # Produto do catálogo criado pelas migrations (umidificador, R$ 68,00).
          # É o mesmo item que o E2E vinha comprando — em produção, até hoje.
          PLAYWRIGHT_E2E_PRODUTO_CODIGO: ${{ vars.PLAYWRIGHT_E2E_PRODUTO_CODIGO || '7898512340004' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SB_SR }}
          SYNC_ENDPOINT: ${{ env.SB_URL }}/functions/v1/sync-outbox
          SYNC_KEY: ${{ env.SYNC_K }}
          USE_UNIFIED_SALES_FLOW: 'true'
          STRICT_MANAGER_DISCOUNT_AUTH: 'true'
          AUTO_ENQUEUE_FISCAL_ON_SALE: 'true'
        run: |
          set -euo pipefail
          # Ver comentário equivalente no job `e2e-playwright` abaixo — mesmo
          # preflight sanitizado, para os dois jobs terem o mesmo contrato.
          faltando=()
          [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && faltando+=("SUPABASE_SERVICE_ROLE_KEY")
          [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] && faltando+=("NEXT_PUBLIC_SUPABASE_URL")
          [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ] && faltando+=("NEXT_PUBLIC_SUPABASE_ANON_KEY")
          [ -z "${SYNC_ENDPOINT:-}" ] && faltando+=("SYNC_ENDPOINT")
          [ -z "${SYNC_KEY:-}" ] && faltando+=("SYNC_KEY")
          if [ "${#faltando[@]}" -gt 0 ]; then
            echo "::error::E2E preflight — variável(is) ausente(s) ou vazia(s): ${faltando[*]}"
            exit 1
          fi
          case "$NEXT_PUBLIC_SUPABASE_URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *)
              echo "::error::E2E preflight — NEXT_PUBLIC_SUPABASE_URL não aponta para ambiente local: $NEXT_PUBLIC_SUPABASE_URL"
              exit 1
              ;;
          esac
          echo "OK — preflight de ambiente do E2E: variáveis obrigatórias presentes, alvo local confirmado."
          npm run test:e2e:critical -w pdv-importados

      # Harness: preservar trace.zip / error-context.md quando o E2E crítico falha.
      - name: Upload Playwright test-results (E2E crítico)
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-critical-test-results
          path: |
            pdv-importados/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      # Cleanup garantido — a VM do runner é destruída ao final de qualquer forma, mas
      # sem isto um `supabase stop` nunca roda quando o job falha (só o passo de upload
      # tinha `if: always()`); isolar isto explicitamente documenta a intenção e evita
      # depender de "a VM some mesmo" como única rede de segurança.
      - name: Encerrar Supabase local
        if: always()
        timeout-minutes: 2
        run: cd backend && npx supabase stop --no-backup || true

  # Deploy de produção: responsabilidade exclusiva da integração nativa da Vercel
  # (GitHub App). O job `deploy` com amondnet/vercel-action foi removido — ver
  # docs/REMEDIACAO_ETAPA1_VALIDACAO.md §2 e docs/PLANO_REMEDIACAO_CICD.md §2.
  # Sourcemaps e release do Sentry continuam sendo enviados pelo próprio
  # `next build` via withSentryConfig (pdv-importados/next.config.js), inclusive
  # no build da Vercel.
  #
  # O gate SSRA saiu daqui para .github/workflows/release-validate.yml, que
  # dispara em `deployment_status` e portanto valida o deploy real,
  # independentemente de qual mecanismo o produziu.

  e2e-playwright:
    needs: build-and-test
    if: ${{ vars.ENABLE_PLAYWRIGHT_E2E == 'true' }}
    runs-on: ubuntu-latest
    # Esta suite ja levava 30m22s quando rodava contra producao (PR #307) — ou
    # seja, vivia raspando o proprio teto. Somando o setup da stack local, o run
    # de 2026-08-19T21:08 estourou com os testes ainda em andamento.
    #
    # 110, não 80: soma dos `timeout-minutes` de cada step agora chega a ~104min
    # no pior caso — mesmo raciocínio do comentário equivalente em `e2e-critical`
    # (subiu de ~73min pela mesma correção de "Install Playwright Chromium" e
    # "Readiness" no code review do PR #315).
    timeout-minutes: 110

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces na raiz)
        timeout-minutes: 5
        run: npm ci

      # 35, não 5: o comentário acima do job documenta este MESMO passo levando
      # 29min sob disputa de pull de imagem entre os dois jobs de E2E rodando
      # em paralelo (run de 2026-08-19T21:08) — 5min cortava o job antes de
      # qualquer teste rodar exatamente nesse cenário já observado, o que o
      # code review do PR #315 apontou (P1: o timeout não cobria a duração já
      # documentada acima dele).
      # Chromium + WebKit: `playwright.config.ts` define `mobile-safari-iphone`
      # (WebKit). Instalar só Chromium (CI #1226) fez 14 falhas determinísticas
      # `browserType.launch: Executable doesn't exist .../webkit-*/pw_run.sh`.
      - name: Install Playwright Chromium + WebKit
        timeout-minutes: 35
        run: npx playwright install --with-deps chromium webkit

      # Mesma stack local e efêmera do `e2e-critical`. Este job foi esquecido na
      # primeira correção e, por isso, continuou logando em PRODUÇÃO com as
      # contas de robô às 20:59 e 21:03 de 2026-08-19 — não escreveu venda
      # naquele run, mas a sessão foi criada e o caminho estava aberto.
      #
      # A lição virou regra: existem DOIS jobs de E2E neste workflow. Qualquer
      # mudança de alvo tem de cobrir os dois.
      # `SYNC_KEY` precisa existir ANTES do `supabase start`: o runtime das Edge
      # Functions resolve `[edge_runtime.secrets]` do config.toml no momento em
      # que sobe. Gerar depois nao adianta — foi o que fez `smoke:sync-edge`
      # responder 500 MISSING_SUPABASE_ENV no primeiro run deste PR.
      - name: Gerar SYNC_KEY efêmera (antes do start)
        run: |
          set -euo pipefail
          SYNC_K="$(openssl rand -hex 32)"
          echo "::add-mask::$SYNC_K"
          echo "SYNC_K=$SYNC_K" >> "$GITHUB_ENV"

      - name: Subir Supabase local
        timeout-minutes: 8
        env:
          SYNC_KEY: ${{ env.SYNC_K }}
        run: bash backend/scripts/ci-supabase-local-start.sh

      - name: Reset + seed (migrations do repositório)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          cd backend
          npx supabase db reset --local --yes

      - name: Gerar credenciais efêmeras
        timeout-minutes: 2
        run: |
          set -euo pipefail
          cd backend
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          cd ..

          SB_URL="${API_URL:-http://127.0.0.1:54321}"
          SB_ANON="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          SB_SR="${SERVICE_ROLE_KEY:-}"
          if [ -z "$SB_ANON" ] || [ -z "$SB_SR" ]; then
            echo "::error::supabase status nao devolveu ANON_KEY/SERVICE_ROLE_KEY." >&2
            exit 1
          fi
          E2E_PASS="$(openssl rand -base64 24)"

          cat > pdv-importados/.env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${SB_URL}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${SB_ANON}
          USE_UNIFIED_SALES_FLOW=true
          EOF

          for v in "$SB_ANON" "$SB_SR" "$E2E_PASS"; do
            echo "::add-mask::$v"
          done

          {
            echo "SB_URL=$SB_URL"
            echo "SB_ANON=$SB_ANON"
            echo "SB_SR=$SB_SR"
            echo "E2E_PASS=$E2E_PASS"
          } >> "$GITHUB_ENV"

      - name: Guard — alvo do E2E não pode ser produção
        timeout-minutes: 1
        env:
          PROD_REF: kbabmewnahysfvlybiak
        run: |
          set -euo pipefail
          case "${SB_URL:-}" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *)
              echo "::error::E2E abortado: alvo nao e local (${SB_URL:-<vazio>})."
              exit 1
              ;;
          esac
          if grep -q "$PROD_REF" pdv-importados/.env.local 2>/dev/null; then
            echo "::error::E2E abortado: .env.local referencia o ref de producao."
            exit 1
          fi
          echo "OK — alvo do E2E e a stack local ($SB_URL)."

      # Ver comentário equivalente no job `e2e-critical` acima (mesmo motivo
      # do timeout de 3min: pior caso de retries + diagnóstico chega a ~130s).
      - name: Readiness — Auth/PostgREST/Postgres antes do E2E
        timeout-minutes: 3
        env:
          SB_URL: ${{ env.SB_URL }}
          SB_ANON: ${{ env.SB_ANON }}
          SB_SR: ${{ env.SB_SR }}
        run: node scripts/ci-e2e-readiness-check.mjs
        working-directory: backend

      - name: Seed usuários E2E (banco local)
        timeout-minutes: 2
        env:
          SUPABASE_URL: ${{ env.SB_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SB_SR }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SB_ANON }}
          SEED_DEV_PASSWORD: ${{ env.E2E_PASS }}
          SEED_GERENTE_EMAIL: e2e-gerente@localhost.test
          SEED_OPERADOR_EMAIL: e2e-operador@localhost.test
        run: node pdv-importados/scripts/seed-dev-users.mjs

      # Contrato de ambiente completo (não copiado do job `e2e-critical`
      # corretamente antes): faltavam SUPABASE_SERVICE_ROLE_KEY, SYNC_ENDPOINT
      # e SYNC_KEY neste step. Sem `SUPABASE_SERVICE_ROLE_KEY`,
      # `assertFase5bGoldenFlowEnvInCi()` (caixa-fase5b-golden-flow-ui.spec.ts,
      # caixa-fase5b-contas-receber.spec.ts) e `assertSyncFlowEnvInCi()`
      # (sync-fluxo-gerente.spec.ts) lançam exceção determinística — não é
      # flakiness, o job nunca teve a credencial para começar. Variáveis do
      # workflow (`${{ env.SB_SR }}` etc.), nunca literais — service_role é
      # sempre a credencial efêmera local gerada em "Gerar credenciais
      # efêmeras" (`supabase status -o env` da stack local do próprio job),
      # nunca a de produção nem de um projeto remoto.
      - name: E2E
        timeout-minutes: 35
        env:
          CI: true
          PLAYWRIGHT_E2E_WITH_DEV: '1'
          NODE_OPTIONS: --max-old-space-size=8192
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SB_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SB_ANON }}
          PLAYWRIGHT_TEST_EMAIL: e2e-gerente@localhost.test
          PLAYWRIGHT_TEST_PASSWORD: ${{ env.E2E_PASS }}
          PLAYWRIGHT_CAIXA_TEST_EMAIL: e2e-operador@localhost.test
          PLAYWRIGHT_CAIXA_TEST_PASSWORD: ${{ env.E2E_PASS }}
          PLAYWRIGHT_E2E_PRODUTO_CODIGO: ${{ vars.PLAYWRIGHT_E2E_PRODUTO_CODIGO || '7898512340004' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SB_SR }}
          SYNC_ENDPOINT: ${{ env.SB_URL }}/functions/v1/sync-outbox
          SYNC_KEY: ${{ env.SYNC_K }}
          USE_UNIFIED_SALES_FLOW: 'true'
          STRICT_MANAGER_DISCOUNT_AUTH: 'true'
          AUTO_ENQUEUE_FISCAL_ON_SALE: 'true'
        run: |
          set -euo pipefail
          # Preflight sanitizado: falha ANTES dos 109 testes se o contrato de
          # ambiente exigido pelos specs estiver incompleto — só checa
          # presença/origem, nunca imprime o valor das credenciais.
          faltando=()
          [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && faltando+=("SUPABASE_SERVICE_ROLE_KEY")
          [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] && faltando+=("NEXT_PUBLIC_SUPABASE_URL")
          [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ] && faltando+=("NEXT_PUBLIC_SUPABASE_ANON_KEY")
          [ -z "${SYNC_ENDPOINT:-}" ] && faltando+=("SYNC_ENDPOINT")
          [ -z "${SYNC_KEY:-}" ] && faltando+=("SYNC_KEY")
          if [ "${#faltando[@]}" -gt 0 ]; then
            echo "::error::E2E preflight — variável(is) ausente(s) ou vazia(s): ${faltando[*]}"
            exit 1
          fi
          case "$NEXT_PUBLIC_SUPABASE_URL" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *)
              echo "::error::E2E preflight — NEXT_PUBLIC_SUPABASE_URL não aponta para ambiente local: $NEXT_PUBLIC_SUPABASE_URL"
              exit 1
              ;;
          esac
          echo "OK — preflight de ambiente do E2E: variáveis obrigatórias presentes, alvo local confirmado."
          npm run test:e2e -w pdv-importados

      # Harness: preservar trace.zip / error-context.md quando esta suíte falha —
      # o job `e2e-critical` já fazia upload; este ficava sem, dificultando o diagnóstico.
      - name: Upload Playwright test-results (e2e-playwright)
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-playwright-test-results
          path: |
            pdv-importados/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Encerrar Supabase local
        if: always()
        timeout-minutes: 2
        run: cd backend && npx supabase stop --no-backup || true
