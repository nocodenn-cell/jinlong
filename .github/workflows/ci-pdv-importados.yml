# CI pdv-importados — SSRA: release authority = Vercel Deployment ID (validate-production).
# Pipeline mínimo: build-and-test (build + typecheck) → deploy → validate-production.
# Produção canônica: https://pdv-importados.vercel.app (projeto Vercel pdv-importados).
# Secrets: CI_NEXT_PUBLIC_*, VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, SENTRY_*.
# Variable opcional: EXPECTED_VERCEL_PROJECT_ID (fail-fast se secret divergir).
name: CI pdv-importados

env:
  PRODUCTION_HOST: pdv-importados.vercel.app

on:
  push:
    branches: [main, develop, staging, 'staging/**']
    paths:
      - 'pdv-importados/**'
      - 'shared-core/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - 'scripts/**'
      - '.github/workflows/ci-pdv-importados.yml'
  pull_request:
    branches: [main, develop, staging, 'staging/**']
    paths:
      - 'pdv-importados/**'
      - 'shared-core/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - 'scripts/**'
      - '.github/workflows/ci-pdv-importados.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces na raiz)
        run: npm ci

      # GATE OBRIGATÓRIO — bloqueia o merge/promoção se falhar (PDV flow, rotas,
      # regra de negócio no core e vendabilidade centralizada). Ative branch
      # protection em main/staging exigindo este job (build-and-test).
      - name: Validação PDV (guards) — gate obrigatório
        run: npm run guard:all

      - name: Vendabilidade centralizada — gate obrigatório
        run: npm run check:vendabilidade

      - name: Lint, typecheck e unit tests
        run: npx turbo run lint typecheck test --filter=pdv-importados

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CI_NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CI_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Defina o secret CI_NEXT_PUBLIC_SUPABASE_ANON_KEY em Settings → Secrets and variables → Actions."
            exit 1
          fi
          npx turbo run build --filter=pdv-importados

  deploy:
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main' && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces na raiz)
        run: npm ci

      - name: Verificar VERCEL_PROJECT_ID (fail-fast)
        env:
          EXPECTED: ${{ vars.EXPECTED_VERCEL_PROJECT_ID }}
          ACTUAL: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "${EXPECTED:-}" ] && [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "::error::VERCEL_PROJECT_ID não corresponde a EXPECTED_VERCEL_PROJECT_ID (projeto pdv-importados)."
            exit 1
          fi

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CI_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CI_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::Defina o secret CI_NEXT_PUBLIC_SUPABASE_URL em Settings → Secrets and variables → Actions."
            exit 1
          fi
          npx turbo run build --filter=pdv-importados

      - name: Upload sourcemaps to Sentry
        uses: getsentry/action-sourcemaps@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          release: ${{ github.sha }}
          sourcemap-paths: pdv-importados/.next/static/chunks

      - name: Deploy to Vercel (production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: pdv-importados
          vercel-args: '--prod'

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          version: ${{ github.sha }}

  validate-production:
    name: validate-production (SSRA)
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: SSRA — platform deploymentId === /api/health
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_ORG_ID }}
          PRODUCTION_HOST: ${{ env.PRODUCTION_HOST }}
        run: node scripts/validate-production.mjs
