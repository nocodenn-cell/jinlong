# CI do app Next em pdv-importados (lint, Vitest, build). Não valida migrations SQL nem Edge — ver ci-backend-supabase.yml.
name: CI pdv-importados

on:
  push:
    branches: [main, develop]
    paths:
      - 'pdv-importados/**'
      - '.github/workflows/ci-pdv-importados.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'pdv-importados/**'
      - '.github/workflows/ci-pdv-importados.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdv-importados

    steps:
      # Sonar githubactions:S7637 — SHA do release da tag indicada
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pdv-importados/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Build exige secret CI_NEXT_PUBLIC_SUPABASE_ANON_KEY (anon do projeto — não versionar JWT no YAML).
      # URL opcional: secret CI_NEXT_PUBLIC_SUPABASE_URL ou placeholder abaixo.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CI_NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CI_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Defina o secret CI_NEXT_PUBLIC_SUPABASE_ANON_KEY em Settings → Secrets and variables → Actions."
            exit 1
          fi
          npm run build

  # Opcional: defina variável de repositório ENABLE_PLAYWRIGHT_E2E=true e os secrets abaixo no GitHub.
  # PLAYWRIGHT_NEXT_PUBLIC_SUPABASE_URL, PLAYWRIGHT_NEXT_PUBLIC_SUPABASE_ANON_KEY
  # (opcional p/ gerente.spec) PLAYWRIGHT_TEST_EMAIL, PLAYWRIGHT_TEST_PASSWORD
  e2e-playwright:
    needs: build-and-test
    if: ${{ vars.ENABLE_PLAYWRIGHT_E2E == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdv-importados

    steps:
      # Sonar githubactions:S7637 — SHA do release da tag indicada
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pdv-importados/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        env:
          CI: true
          PLAYWRIGHT_E2E_WITH_DEV: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PLAYWRIGHT_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PLAYWRIGHT_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
        run: npm run test:e2e
