# CI pdv-importados — SSRA: release authority = Vercel Deployment ID (validate-production).
# E2E = sistema de risco, não sistema de decisão (e2e-critical não bloqueia deploy).
# Produção canônica: https://pdv-importados.vercel.app (projeto Vercel pdv-importados).
# Secrets: CI_NEXT_PUBLIC_*, VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID,
#   SENTRY_*, PLAYWRIGHT_* (e2e-critical assíncrono), SYNC_*, FISCAL_WORKER_KEY.
# Variable opcional: EXPECTED_VERCEL_PROJECT_ID (fail-fast se secret divergir).
name: CI pdv-importados

env:
  PRODUCTION_HOST: pdv-importados.vercel.app

on:
  push:
    branches: [main, develop]
    paths:
      - 'pdv-importados/**'
      - 'shared-core/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - 'scripts/validate-production.mjs'
      - '.github/workflows/ci-pdv-importados.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'pdv-importados/**'
      - 'shared-core/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - 'scripts/validate-production.mjs'
      - '.github/workflows/ci-pdv-importados.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Histórico completo p/ o Migration Checklist Gate diffar contra a base da PR.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces na raiz)
        run: npm ci

      # Gate de PROCESSO de migração — roda ANTES de lint/typecheck/test.
      # Exige migration-checklist.json válido/atualizado quando a UI muda.
      - name: Migration Checklist Gate
        env:
          CHECKLIST_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run guard:migration-checklist

      - name: Architecture Lock (core rules, PDV flow, routes)
        run: npm run guard:all

      # Contrato do sistema de temas — gate dedicado e independente do guard:all
      # (não pode ser mascarado por falhas pré-existentes de outros guards).
      - name: Theme contract guard
        run: npm run guard:theme

      - name: Lint, typecheck e unit tests
        run: npx turbo run lint typecheck test --filter=pdv-importados

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CI_NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CI_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Defina o secret CI_NEXT_PUBLIC_SUPABASE_ANON_KEY em Settings → Secrets and variables → Actions."
            exit 1
          fi
          npx turbo run build --filter=pdv-importados

  # Sistema de risco (não decisão): observa regressão funcional; não entra em needs: do deploy.
  e2e-critical:
    name: E2E crítico (sistema de risco)
    needs: build-and-test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces na raiz)
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verificar secrets e gravar .env (pipeline crítico)
        env:
          PW_URL: ${{ secrets.PLAYWRIGHT_NEXT_PUBLIC_SUPABASE_URL }}
          PW_ANON: ${{ secrets.PLAYWRIGHT_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PW_GER_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          PW_GER_PASS: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          PW_CX_EMAIL: ${{ secrets.PLAYWRIGHT_CAIXA_TEST_EMAIL }}
          PW_CX_PASS: ${{ secrets.PLAYWRIGHT_CAIXA_TEST_PASSWORD }}
          SR_KEY: ${{ secrets.PLAYWRIGHT_SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_EP: ${{ secrets.SYNC_ENDPOINT }}
          SYNC_K: ${{ secrets.SYNC_KEY }}
          FISCAL_KEY: ${{ secrets.FISCAL_WORKER_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${PW_URL:-}" ] && missing+=(PLAYWRIGHT_NEXT_PUBLIC_SUPABASE_URL)
          [ -z "${PW_ANON:-}" ] && missing+=(PLAYWRIGHT_NEXT_PUBLIC_SUPABASE_ANON_KEY)
          [ -z "${PW_GER_EMAIL:-}" ] && missing+=(PLAYWRIGHT_TEST_EMAIL)
          [ -z "${PW_GER_PASS:-}" ] && missing+=(PLAYWRIGHT_TEST_PASSWORD)
          [ -z "${PW_CX_EMAIL:-}" ] && missing+=(PLAYWRIGHT_CAIXA_TEST_EMAIL)
          [ -z "${PW_CX_PASS:-}" ] && missing+=(PLAYWRIGHT_CAIXA_TEST_PASSWORD)
          [ -z "${SR_KEY:-}" ] && missing+=(PLAYWRIGHT_SUPABASE_SERVICE_ROLE_KEY)
          [ -z "${SYNC_EP:-}" ] && missing+=(SYNC_ENDPOINT)
          [ -z "${SYNC_K:-}" ] && missing+=(SYNC_KEY)
          [ -z "${FISCAL_KEY:-}" ] && missing+=(FISCAL_WORKER_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::E2E crítico: defina os secrets ${missing[*]} (ver docs/E2E.md e docs/SSRA_RELEASE.md)."
            exit 1
          fi
          FISCAL_EP="${PW_URL%/}/functions/v1/fiscal-worker"
          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$PW_URL"
            printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$PW_ANON"
            printf '%s\n' 'USE_UNIFIED_SALES_FLOW=true'
            printf '%s\n' 'STRICT_MANAGER_DISCOUNT_AUTH=true'
            printf '%s\n' 'AUTO_ENQUEUE_FISCAL_ON_SALE=true'
            printf 'FISCAL_WORKER_ENDPOINT=%s\n' "$FISCAL_EP"
            printf 'FISCAL_WORKER_KEY=%s\n' "$FISCAL_KEY"
          } > pdv-importados/.env.local
          {
            printf 'SYNC_ENDPOINT=%s\n' "$SYNC_EP"
            printf 'SYNC_KEY=%s\n' "$SYNC_K"
          } > pdv-local/.env

      - name: Pipeline E2E crítico
        env:
          CI: true
          PLAYWRIGHT_E2E_WITH_DEV: ${{ secrets.PLAYWRIGHT_BASE_URL != '' && '0' || '1' }}
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PLAYWRIGHT_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PLAYWRIGHT_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          PLAYWRIGHT_CAIXA_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_CAIXA_TEST_EMAIL }}
          PLAYWRIGHT_CAIXA_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_CAIXA_TEST_PASSWORD }}
          PLAYWRIGHT_E2E_PRODUTO_CODIGO: ${{ secrets.PLAYWRIGHT_E2E_PRODUTO_CODIGO }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PLAYWRIGHT_SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_ENDPOINT: ${{ secrets.SYNC_ENDPOINT }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
          USE_UNIFIED_SALES_FLOW: 'true'
          STRICT_MANAGER_DISCOUNT_AUTH: 'true'
          AUTO_ENQUEUE_FISCAL_ON_SALE: 'true'
        run: npm run test:e2e:critical -w pdv-importados

  deploy:
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main' && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces na raiz)
        run: npm ci

      - name: Verificar VERCEL_PROJECT_ID (fail-fast)
        env:
          EXPECTED: ${{ vars.EXPECTED_VERCEL_PROJECT_ID }}
          ACTUAL: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "${EXPECTED:-}" ] && [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "::error::VERCEL_PROJECT_ID não corresponde a EXPECTED_VERCEL_PROJECT_ID (projeto pdv-importados)."
            exit 1
          fi

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CI_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CI_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::Defina o secret CI_NEXT_PUBLIC_SUPABASE_URL em Settings → Secrets and variables → Actions."
            exit 1
          fi
          npx turbo run build --filter=pdv-importados

      - name: Upload sourcemaps to Sentry
        uses: getsentry/action-sourcemaps@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          release: ${{ github.sha }}
          sourcemap-paths: pdv-importados/.next/static/chunks

      - name: Deploy to Vercel (production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: pdv-importados
          vercel-args: '--prod'

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          version: ${{ github.sha }}

  validate-production:
    name: validate-production (SSRA)
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: SSRA — platform deploymentId === /api/health
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_ORG_ID }}
          PRODUCTION_HOST: ${{ env.PRODUCTION_HOST }}
        run: node scripts/validate-production.mjs

  e2e-playwright:
    needs: build-and-test
    if: ${{ vars.ENABLE_PLAYWRIGHT_E2E == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces na raiz)
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        env:
          CI: true
          PLAYWRIGHT_E2E_WITH_DEV: ${{ secrets.PLAYWRIGHT_BASE_URL != '' && '0' || '1' }}
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PLAYWRIGHT_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PLAYWRIGHT_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          PLAYWRIGHT_CAIXA_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_CAIXA_TEST_EMAIL }}
          PLAYWRIGHT_CAIXA_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_CAIXA_TEST_PASSWORD }}
          PLAYWRIGHT_E2E_PRODUTO_CODIGO: ${{ secrets.PLAYWRIGHT_E2E_PRODUTO_CODIGO }}
        run: npm run test:e2e -w pdv-importados
