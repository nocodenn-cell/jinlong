# CI pdv-importados — apenas verificação. NÃO faz deploy.
# Deploy de produção: integração nativa da Vercel (GitHub App), acionada por push.
# Gate SSRA: .github/workflows/release-validate.yml (dispara em deployment_status).
# E2E = sistema de risco, não sistema de decisão (e2e-critical não bloqueia nada).
# Produção canônica: https://pdv-importados.vercel.app (projeto Vercel pdv-importados).
# Secrets: CI_NEXT_PUBLIC_*, PLAYWRIGHT_* (e2e-critical assíncrono), SYNC_*, FISCAL_WORKER_KEY.
name: CI pdv-importados

# Cancela execuções obsoletas do mesmo ref. Sem isto, cada commit intermediário
# de uma PR deixa um run completo rodando até o fim mesmo já estando superado —
# principal driver do consumo de minutos que estourou a cota (ver P0-1).
# Em `main` NÃO cancela: um commit que já entrou precisa ser validado até o fim.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege explícito — ver nota em ci-backend-supabase.yml.
permissions:
  contents: read

# Gate de merge: roda em pull_request, que já testa o resultado do merge.
# Não roda em push para `main` — seria revalidar o mesmo código uma segunda vez,
# e o deploy da Vercel não depende deste workflow. O piso de segurança em push
# direto para main é coberto por secret-scan.yml.
on:
  pull_request:
    branches: [main]
    paths:
      - 'pdv-importados/**'
      - 'shared-core/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/ci-pdv-importados.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces na raiz)
        run: npm ci

      - name: Architecture Lock (core rules, PDV flow, routes)
        run: npm run guard:all

      - name: Lint, typecheck e unit tests
        run: npx turbo run lint typecheck test --filter=pdv-importados

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CI_NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CI_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Defina o secret CI_NEXT_PUBLIC_SUPABASE_ANON_KEY em Settings → Secrets and variables → Actions."
            exit 1
          fi
          npx turbo run build --filter=pdv-importados

  # Sistema de risco (não decisão): observa regressão funcional; não entra em needs: do deploy.
  e2e-critical:
    name: E2E crítico (sistema de risco)
    needs: build-and-test
    # A exclusão de forks existia porque o job dependia de secrets, que o
    # GitHub não injeta em PR de fork. Com a stack local o job não consome
    # secret nenhum — então passa a rodar em fork também, que é onde uma
    # regressão funcional tem mais chance de entrar sem ninguém ver.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces na raiz)
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # ─────────────────────────────────────────────────────────────────────
      # Stack Supabase LOCAL e efêmera — substitui o alvo remoto.
      #
      # Antes, este job apontava para um Supabase remoto via secrets
      # PLAYWRIGHT_*. Como não existia homologação, apontava para PRODUÇÃO.
      #
      # A stack local resolve a classe inteira do problema, não só o sintoma:
      #   - impossível poluir produção: o banco nasce e morre dentro do job;
      #   - reproduzível a partir do repositório — `db reset` aplica as
      #     migrations e o seed, então o E2E testa o que está no Git;
      #   - sem `service_role` remota em secret de CI;
      #   - roda em PR de fork, que não recebe secrets.
      #
      # Mesmo script usado pelo job `supabase-local-gates` de
      # `ci-backend-supabase.yml`, onde já roda estável.
      # ─────────────────────────────────────────────────────────────────────
      - name: Subir Supabase local
        run: bash backend/scripts/ci-supabase-local-start.sh

      - name: Reset + seed (migrations do repositório)
        run: |
          set -euo pipefail
          cd backend
          npx supabase db reset --local --yes

      - name: Gerar credenciais efêmeras e gravar .env
        id: localenv
        run: |
          set -euo pipefail
          cd backend
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          cd ..

          SB_URL="${API_URL:-http://127.0.0.1:54321}"
          SB_ANON="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          SB_SR="${SERVICE_ROLE_KEY:-}"
          if [ -z "$SB_ANON" ] || [ -z "$SB_SR" ]; then
            echo "::error::supabase status nao devolveu ANON_KEY/SERVICE_ROLE_KEY." >&2
            exit 1
          fi

          # Segredos de vida curta: existem só enquanto este job existe. Nada
          # aqui pode ser reaproveitado fora da máquina do runner, então não
          # há valor em guardá-los como secret do repositório.
          E2E_PASS="$(openssl rand -base64 24)"
          SYNC_K="$(openssl rand -hex 32)"
          FISCAL_KEY="$(openssl rand -hex 32)"

          cat > pdv-importados/.env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${SB_URL}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${SB_ANON}
          USE_UNIFIED_SALES_FLOW=true
          STRICT_MANAGER_DISCOUNT_AUTH=true
          AUTO_ENQUEUE_FISCAL_ON_SALE=true
          FISCAL_WORKER_ENDPOINT=${SB_URL}/functions/v1/fiscal-worker
          FISCAL_WORKER_KEY=${FISCAL_KEY}
          EOF

          cat > pdv-local/.env <<EOF
          SYNC_ENDPOINT=${SB_URL}/functions/v1/sync-outbox
          SYNC_KEY=${SYNC_K}
          SUPABASE_ANON_KEY=${SB_ANON}
          NEXT_PUBLIC_SUPABASE_URL=${SB_URL}
          EOF

          # Mascarar antes de exportar: sem isto o log do runner imprime as
          # chaves em claro em qualquer `set -x` ou echo acidental.
          for v in "$SB_ANON" "$SB_SR" "$E2E_PASS" "$SYNC_K" "$FISCAL_KEY"; do
            echo "::add-mask::$v"
          done

          {
            echo "SB_URL=$SB_URL"
            echo "SB_ANON=$SB_ANON"
            echo "SB_SR=$SB_SR"
            echo "E2E_PASS=$E2E_PASS"
            echo "SYNC_K=$SYNC_K"
            echo "FISCAL_KEY=$FISCAL_KEY"
          } >> "$GITHUB_ENV"

      # ─────────────────────────────────────────────────────────────────────
      # Guard: o E2E NUNCA pode tocar o projeto de produção.
      #
      # Em 2026-08-19 descobrimos que tocava. Os secrets PLAYWRIGHT_* apontavam
      # para `kbabmewnahysfvlybiak`, e cada PR gravava dado real na loja do
      # cliente: 11 vendas de R$ 68,00 só nos runs de #307 e #308, além das
      # lojas `Probe …` / `Smoke Homolog …` e de caixas abandonados que
      # precisaram ser removidos à mão.
      #
      # Agravante: `seed-dev-users.mjs` faz `upsert ... ativo: true`. Desativar
      # as contas de robô à mão não resolvia — o PR seguinte as reativava.
      #
      # Este passo checa o alvo EFETIVO (o que foi resolvido da stack local e
      # escrito nos .env), não os secrets. Checar secrets seria pior que inútil
      # aqui: eles continuam existindo e apontando para produção, então o job
      # reprovaria sempre, por um motivo que já não se aplica.
      #
      # Roda ANTES do seed, que é a primeira escrita de dado do pipeline.
      # ─────────────────────────────────────────────────────────────────────
      - name: Guard — alvo do E2E não pode ser produção
        env:
          PROD_REF: kbabmewnahysfvlybiak
        run: |
          set -euo pipefail
          falhas=()

          case "${SB_URL:-}" in
            *"$PROD_REF"*) falhas+=("SB_URL=$SB_URL") ;;
            http://127.0.0.1:*|http://localhost:*) ;;
            *) falhas+=("SB_URL nao e local: ${SB_URL:-<vazio>}") ;;
          esac

          for arquivo in pdv-importados/.env.local pdv-local/.env; do
            if grep -q "$PROD_REF" "$arquivo" 2>/dev/null; then
              falhas+=("$arquivo referencia o ref de producao")
            fi
          done

          if [ "${#falhas[@]}" -gt 0 ]; then
            for f in "${falhas[@]}"; do
              echo "::error::E2E abortado — alvo invalido: $f"
            done
            echo "::error::O E2E grava vendas, lojas e caixas. Ele so pode rodar contra a stack local efemera."
            exit 1
          fi
          echo "OK — alvo do E2E e a stack local ($SB_URL); nenhuma referencia a producao."

      - name: Seed usuários E2E (banco local)
        env:
          SUPABASE_URL: ${{ env.SB_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SB_SR }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SB_ANON }}
          SEED_DEV_PASSWORD: ${{ env.E2E_PASS }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ env.E2E_PASS }}
          PLAYWRIGHT_CAIXA_TEST_PASSWORD: ${{ env.E2E_PASS }}
          SEED_GERENTE_EMAIL: e2e-gerente@localhost.test
          SEED_OPERADOR_EMAIL: e2e-operador@localhost.test
        run: node pdv-importados/scripts/seed-dev-users.mjs

      - name: Pipeline E2E crítico
        env:
          CI: true
          PLAYWRIGHT_E2E_WITH_DEV: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SB_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SB_ANON }}
          PLAYWRIGHT_TEST_EMAIL: e2e-gerente@localhost.test
          PLAYWRIGHT_TEST_PASSWORD: ${{ env.E2E_PASS }}
          PLAYWRIGHT_CAIXA_TEST_EMAIL: e2e-operador@localhost.test
          PLAYWRIGHT_CAIXA_TEST_PASSWORD: ${{ env.E2E_PASS }}
          # Produto do catálogo criado pelas migrations (umidificador, R$ 68,00).
          # É o mesmo item que o E2E vinha comprando — em produção, até hoje.
          PLAYWRIGHT_E2E_PRODUTO_CODIGO: ${{ vars.PLAYWRIGHT_E2E_PRODUTO_CODIGO || '7898512340004' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SB_SR }}
          SYNC_ENDPOINT: ${{ env.SB_URL }}/functions/v1/sync-outbox
          SYNC_KEY: ${{ env.SYNC_K }}
          USE_UNIFIED_SALES_FLOW: 'true'
          STRICT_MANAGER_DISCOUNT_AUTH: 'true'
          AUTO_ENQUEUE_FISCAL_ON_SALE: 'true'
        run: npm run test:e2e:critical -w pdv-importados

      # Harness: preservar trace.zip / error-context.md quando o E2E crítico falha.
      - name: Upload Playwright test-results (E2E crítico)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-critical-test-results
          path: |
            pdv-importados/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  # Deploy de produção: responsabilidade exclusiva da integração nativa da Vercel
  # (GitHub App). O job `deploy` com amondnet/vercel-action foi removido — ver
  # docs/REMEDIACAO_ETAPA1_VALIDACAO.md §2 e docs/PLANO_REMEDIACAO_CICD.md §2.
  # Sourcemaps e release do Sentry continuam sendo enviados pelo próprio
  # `next build` via withSentryConfig (pdv-importados/next.config.js), inclusive
  # no build da Vercel.
  #
  # O gate SSRA saiu daqui para .github/workflows/release-validate.yml, que
  # dispara em `deployment_status` e portanto valida o deploy real,
  # independentemente de qual mecanismo o produziu.

  e2e-playwright:
    needs: build-and-test
    if: ${{ vars.ENABLE_PLAYWRIGHT_E2E == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces na raiz)
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Mesma stack local e efêmera do `e2e-critical`. Este job foi esquecido na
      # primeira correção e, por isso, continuou logando em PRODUÇÃO com as
      # contas de robô às 20:59 e 21:03 de 2026-08-19 — não escreveu venda
      # naquele run, mas a sessão foi criada e o caminho estava aberto.
      #
      # A lição virou regra: existem DOIS jobs de E2E neste workflow. Qualquer
      # mudança de alvo tem de cobrir os dois.
      - name: Subir Supabase local
        run: bash backend/scripts/ci-supabase-local-start.sh

      - name: Reset + seed (migrations do repositório)
        run: |
          set -euo pipefail
          cd backend
          npx supabase db reset --local --yes

      - name: Gerar credenciais efêmeras
        run: |
          set -euo pipefail
          cd backend
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          cd ..

          SB_URL="${API_URL:-http://127.0.0.1:54321}"
          SB_ANON="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          SB_SR="${SERVICE_ROLE_KEY:-}"
          if [ -z "$SB_ANON" ] || [ -z "$SB_SR" ]; then
            echo "::error::supabase status nao devolveu ANON_KEY/SERVICE_ROLE_KEY." >&2
            exit 1
          fi
          E2E_PASS="$(openssl rand -base64 24)"

          cat > pdv-importados/.env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${SB_URL}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${SB_ANON}
          USE_UNIFIED_SALES_FLOW=true
          EOF

          for v in "$SB_ANON" "$SB_SR" "$E2E_PASS"; do
            echo "::add-mask::$v"
          done

          {
            echo "SB_URL=$SB_URL"
            echo "SB_ANON=$SB_ANON"
            echo "SB_SR=$SB_SR"
            echo "E2E_PASS=$E2E_PASS"
          } >> "$GITHUB_ENV"

      - name: Guard — alvo do E2E não pode ser produção
        env:
          PROD_REF: kbabmewnahysfvlybiak
        run: |
          set -euo pipefail
          case "${SB_URL:-}" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *)
              echo "::error::E2E abortado: alvo nao e local (${SB_URL:-<vazio>})."
              exit 1
              ;;
          esac
          if grep -q "$PROD_REF" pdv-importados/.env.local 2>/dev/null; then
            echo "::error::E2E abortado: .env.local referencia o ref de producao."
            exit 1
          fi
          echo "OK — alvo do E2E e a stack local ($SB_URL)."

      - name: Seed usuários E2E (banco local)
        env:
          SUPABASE_URL: ${{ env.SB_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SB_SR }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SB_ANON }}
          SEED_DEV_PASSWORD: ${{ env.E2E_PASS }}
          SEED_GERENTE_EMAIL: e2e-gerente@localhost.test
          SEED_OPERADOR_EMAIL: e2e-operador@localhost.test
        run: node pdv-importados/scripts/seed-dev-users.mjs

      - name: E2E
        env:
          CI: true
          PLAYWRIGHT_E2E_WITH_DEV: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SB_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SB_ANON }}
          PLAYWRIGHT_TEST_EMAIL: e2e-gerente@localhost.test
          PLAYWRIGHT_TEST_PASSWORD: ${{ env.E2E_PASS }}
          PLAYWRIGHT_CAIXA_TEST_EMAIL: e2e-operador@localhost.test
          PLAYWRIGHT_CAIXA_TEST_PASSWORD: ${{ env.E2E_PASS }}
          PLAYWRIGHT_E2E_PRODUTO_CODIGO: ${{ vars.PLAYWRIGHT_E2E_PRODUTO_CODIGO || '7898512340004' }}
        run: npm run test:e2e -w pdv-importados
