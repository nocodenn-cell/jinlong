name: CI core (bloqueante)
# Layer 1 — único workflow que decide "pode mergear?".
#
# Regras rígidas:
#   - sem serviços externos (Supabase, RLS, edge-functions, migrations remotas)
#   - sem uploads de artefatos (Sentry sourcemaps, etc.)
#   - qualquer falha aqui bloqueia merge — sem continue-on-error neste arquivo
#
# Instrumentação obrigatória:
#   - Cada step crítico tem: timestamp, exit code, duração, amostra de stdout
#   - Marker final: CI_EXECUTION_COMPLETE — prova de execução completa
#   - Se marker não aparecer → pipeline incompleto
#
# CI_DEBUG mode (workflow_dispatch):
#   - Roda apenas: checkout + node -v + npm ci + guard:all + lint config check
#   - Objetivo: isolar FAIL DE INFRA (ambiente) de FAIL DE CÓDIGO
#   - Pula: testes completos, build pesado
#
# Para ativar proteção de branch:
#   Settings → Branches → require status checks →
#   selecionar "Architecture Guard" e "Web — lint · typecheck · test · build"

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'pdv-importados/**'
      - 'shared-core/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/ci-core.yml'
  push:
    branches: [main, develop]
    paths:
      - 'pdv-importados/**'
      - 'shared-core/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/ci-core.yml'
  workflow_dispatch:
    inputs:
      ci_debug:
        description: 'Debug mode — só valida setup (install + lint config) sem testes/build'
        type: boolean
        default: false

jobs:
  guard:
    name: Architecture Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Node version
        shell: bash
        run: |
          node --version
          npm --version
          uname -a

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 'TRACE: npm ci'
        shell: bash
        env:
          SENTRYCLI_SKIP_DOWNLOAD: '1'
          NPM_CONFIG_FUND: 'false'
        run: |
          set +e
          TRACE_START=$(date +%s%3N)
          npm ci --no-audit 2>&1 | tee /tmp/npm-ci-guard.log
          TRACE_EXIT=${PIPESTATUS[0]}
          TRACE_END=$(date +%s%3N)
          TRACE_DUR=$((TRACE_END - TRACE_START))
          echo ""
          echo "[TRACE] npm ci | exit=$TRACE_EXIT | dur=${TRACE_DUR}ms"
          tail -20 /tmp/npm-ci-guard.log
          exit $TRACE_EXIT

      - name: 'TRACE: guard:all'
        if: ${{ inputs.ci_debug != true }}
        shell: bash
        run: |
          set +e
          TRACE_START=$(date +%s%3N)
          npm run guard:all
          TRACE_EXIT=$?
          TRACE_END=$(date +%s%3N)
          TRACE_DUR=$((TRACE_END - TRACE_START))
          echo ""
          echo "[TRACE] guard:all | exit=$TRACE_EXIT | dur=${TRACE_DUR}ms"
          exit $TRACE_EXIT

      - name: 'CI_EXECUTION_COMPLETE'
        if: always()
        run: echo "CI_EXECUTION_COMPLETE: Architecture Guard job finished"

  web:
    name: Web — lint · typecheck · test · build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Node version
        shell: bash
        run: |
          node --version
          npm --version
          uname -a

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 'TRACE: npm ci'
        shell: bash
        env:
          SENTRYCLI_SKIP_DOWNLOAD: '1'
          NPM_CONFIG_FUND: 'false'
        run: |
          set +e
          TRACE_START=$(date +%s%3N)
          npm ci --no-audit 2>&1 | tee /tmp/npm-ci-web.log
          TRACE_EXIT=${PIPESTATUS[0]}
          TRACE_END=$(date +%s%3N)
          TRACE_DUR=$((TRACE_END - TRACE_START))
          echo ""
          echo "[TRACE] npm ci | exit=$TRACE_EXIT | dur=${TRACE_DUR}ms"
          tail -20 /tmp/npm-ci-web.log
          exit $TRACE_EXIT

      - name: 'TRACE: lint + typecheck + test'
        if: ${{ inputs.ci_debug != true }}
        shell: bash
        run: |
          set +e
          TRACE_START=$(date +%s%3N)
          npx turbo run lint typecheck test --filter=pdv-importados 2>&1 | tee /tmp/turbo-checks.log
          TRACE_EXIT=${PIPESTATUS[0]}
          TRACE_END=$(date +%s%3N)
          TRACE_DUR=$((TRACE_END - TRACE_START))
          echo ""
          echo "[TRACE] turbo lint+typecheck+test | exit=$TRACE_EXIT | dur=${TRACE_DUR}ms"
          tail -30 /tmp/turbo-checks.log
          exit $TRACE_EXIT

      - name: 'TRACE: build'
        if: ${{ inputs.ci_debug != true }}
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CI_NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CI_NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key-core-ci' }}
          SENTRYCLI_SKIP_DOWNLOAD: '1'
        run: |
          set +e
          TRACE_START=$(date +%s%3N)
          npx turbo run build --filter=pdv-importados 2>&1 | tee /tmp/turbo-build.log
          TRACE_EXIT=${PIPESTATUS[0]}
          TRACE_END=$(date +%s%3N)
          TRACE_DUR=$((TRACE_END - TRACE_START))
          echo ""
          echo "[TRACE] turbo build | exit=$TRACE_EXIT | dur=${TRACE_DUR}ms"
          tail -30 /tmp/turbo-build.log
          exit $TRACE_EXIT

      - name: 'CI_EXECUTION_COMPLETE'
        if: always()
        run: echo "CI_EXECUTION_COMPLETE: Web — lint · typecheck · test · build job finished"
