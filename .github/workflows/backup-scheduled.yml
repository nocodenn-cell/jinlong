# Item 19 do Plano Mestre de Fechamento dos Gaps — backup lógico automatizado
# de produção (roles + schema + data), sem senha permanente de banco e sem
# role nova/BYPASSRLS permanente.
#
# Mecanismo (arquitetura aprovada, ver histórico do Plano Mestre):
#   Temporary Access/JIT (Supabase) → autoriza, por execução, uma janela curta
#   (10 min) para o role `postgres` assumido pelo usuário dono do
#   SUPABASE_BACKUP_JIT_PAT (um Personal Access Token com escopo único
#   "Database JIT: Read", restrito ao projeto kbabmewnahysfvlybiak).
#   O mesmo token funciona como senha da conexão Postgres nessa janela
#   (mecanismo oficial de Temporary Access do Supabase).
#
#   `supabase db dump --db-url "..."` (conexão explícita, não `--linked`)
#   inclui public + auth.users + roles + RLS policies + functions + triggers
#   — confirmado pela doc oficial "Restore a Platform Project to
#   Self-Hosted". `--linked` excluiria auth/storage; por isso usamos sempre
#   `--db-url` com a connection string construída nesta execução.
#
#   Storage (arquivos, não metadata) NÃO está coberto por este backup —
#   confirmado zero objetos reais em produção hoje (bucket produto-imagens
#   vazio); revisão obrigatória da estratégia de Storage no dia em que o
#   primeiro objeto for criado.
#
#   O dump nunca é persistido em texto puro: cada arquivo é cifrado com
#   `age` (chave pública não-secreta, BACKUP_AGE_PUBLIC_KEY) antes do
#   upload como artifact. A chave privada de decifragem só existe no
#   workflow de restore-drill, nunca neste.
name: Backup automatico (item 19)

permissions:
  contents: read

concurrency:
  group: backup-scheduled
  cancel-in-progress: false

on:
  schedule:
    # 06:00 UTC ~ 03:00 America/Sao_Paulo — fora do horario comercial.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

env:
  SUPABASE_PROJECT_REF: kbabmewnahysfvlybiak
  SUPABASE_PROJECT_REGION: sa-east-1

jobs:
  backup:
    name: Backup real (roles + schema + data, cifrado)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # NOTA: as demais actions deste repo sao fixadas por SHA (convencao
      # estabelecida). Nao foi possivel confirmar o SHA exato desta acao
      # oficial da Supabase sem acesso a internet nesta sessao; usando a
      # tag major documentada pela propria Supabase. Pinar por SHA e um
      # follow-up de hardening, nao um bloqueador de seguranca (namespace
      # oficial supabase/*).
      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Instalar age (cifragem) e cliente postgres (psql)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y age postgresql-client

      - name: Checkout (scripts de backup)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          sparse-checkout: backend/scripts
      - name: Selecionar metodo de acesso ao banco
        id: method
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Metodo "cli": token de acesso (PAT) -> supabase CLI cria uma role temporaria
          # (cli_login_postgres) sem senha permanente de banco. Validado em 2026-10-08
          # (dump + restore reais). Metodo "jit": Temporary Access, bloqueado por
          # "PAM authentication failed" ate o suporte Supabase resolver.
          if [ -n "$ACCESS_TOKEN" ]; then
            echo "method=cli" >> "$GITHUB_OUTPUT"
          else
            echo "method=jit" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN ausente: usando Temporary Access/JIT (bloqueado ate o suporte Supabase resolver)."
          fi
      - name: Autorizar janela Temporary Access/JIT (10 min, role postgres)
        if: steps.method.outputs.method == 'jit'
        env:
          JIT_PAT: ${{ secrets.SUPABASE_BACKUP_JIT_PAT }}
          BACKUP_USER_ID: ${{ vars.SUPABASE_BACKUP_USER_ID }}
        run: |
          set -euo pipefail
          # Diagnostico seguro (nunca imprime o valor): confirma que o secret
          # nao carrega espaco/nova linha acidental - a API de Management
          # (Authorization: Bearer) costuma tolerar isso, mas uma senha bruta
          # embutida numa connection string (URI/libpq) nao tolera, e o
          # sintoma seria um "PAM authentication failed" identico ao de uma
          # senha genuinamente errada.
          if printf '%s' "$JIT_PAT" | grep -q '[[:space:]]'; then
            echo "::warning::SUPABASE_BACKUP_JIT_PAT contem espaco em branco/nova linha - pode corromper a senha bruta usada na connection string do pooler."
          fi
          echo "Diagnostico seguro (sem expor valor): comprimento do PAT = $(printf '%s' "$JIT_PAT" | wc -c) caracteres."

          expires_at_ms=$(( ($(date -u +%s) + 600) * 1000 ))
          # Corpo do PUT usa "roles" (UpdateJitAccessBody, confirmado no OpenAPI
          # atual da Supabase). "user_roles" e o nome do campo no RESPONSE
          # (JitAccessResponse), nao no request - nomes diferentes entre os
          # dois lados do mesmo endpoint.
          #
          # allowed_networks explicito (0.0.0.0/0): runners hospedados do
          # GitHub nao tem IP de saida estatico - cada execucao usa um IP
          # publico diferente (confirmado nos logs do Supavisor: 3 execucoes,
          # 3 peer_ip diferentes). Sem essa lista, a conexao real falhava com
          # "tenant/user ... not found" mesmo com a autorizacao JIT confirmada
          # via GET - consistente com o campo, quando omitido, resultar em
          # nenhuma rede permitida (nao em "todas as redes permitidas"). Nao
          # amplia a superficie de exposicao real do projeto: o Postgres ja
          # aceita conexoes de qualquer IP publico para os demais roles
          # (anon/authenticated/service_role); o papel `postgres` via JIT
          # continua restrito por tempo (10 min), role especifico e posse da
          # PAT escopada.
          http_code=$(curl -sS -o /tmp/jit-response.json -w '%{http_code}' \
            -X PUT "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/jit" \
            -H "Authorization: Bearer ${JIT_PAT}" \
            -H "Content-Type: application/json" \
            -d "{\"user_id\":\"${BACKUP_USER_ID}\",\"roles\":[{\"role\":\"postgres\",\"expires_at\":${expires_at_ms},\"allowed_networks\":{\"allowed_cidrs\":[{\"cidr\":\"0.0.0.0/0\"}]}}]}")
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Falha ao autorizar Temporary Access (HTTP ${http_code}). Corpo da resposta (sem segredo) salvo em /tmp/jit-response.json."
            cat /tmp/jit-response.json
            exit 1
          fi
          echo "JIT autorizado ate $(date -u -d "@$((expires_at_ms/1000))" '+%Y-%m-%dT%H:%M:%SZ')."

          # Confirma via GET (sem PAT no output) o que foi de fato gravado -
          # diagnostico direto, sem depender de leitura manual fora do CI.
          curl -sS -o /tmp/jit-get.json -w 'GET jit-access: HTTP %{http_code}\n' \
            -X GET "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/jit" \
            -H "Authorization: Bearer ${JIT_PAT}" || true
          cat /tmp/jit-get.json || true
          echo

          # Hipotese ainda nao testada: a API de Management (plano de
          # controle) confirma o grant instantaneamente, mas o Supavisor
          # (plano de dados, quem realmente faz PAM auth na conexao) pode
          # sincronizar/cachear grants JIT periodicamente, nao em tempo
          # real. Toda tentativa anterior conectou 1-2s apos o PUT/GET -
          # tempo insuficiente se houver propagacao. Espera curta e barata
          # (15s, insignificante frente aos 10 min da janela) antes da
          # primeira tentativa real de conexao.
          echo "Aguardando 15s para eventual propagacao do grant ao Supavisor..."
          sleep 15

      - name: Descobrir host do pooler (teste real de tenant, nao pg_isready)
        if: steps.method.outputs.method == 'jit'
        id: discover-pooler
        env:
          JIT_PAT: ${{ secrets.SUPABASE_BACKUP_JIT_PAT }}
        run: |
          set -euo pipefail
          set +x
          # `pg_isready` so confirma que ALGUM processo Supavisor esta
          # escutando naquele host - nao que ele conhece o tenant deste
          # projeto. Achado ao vivo (nslookup, sem credenciais): aws-0 e
          # aws-1-sa-east-1.pooler.supabase.com resolvem para ELBs
          # DIFERENTES (IPs completamente distintos) - clusters realmente
          # separados, nao copias redundantes do mesmo pool regional; aws-2+
          # nem existe em DNS nesta regiao hoje. O host anterior (aws-0,
          # escolhido so por responder pg_isready) causava "tenant/user ...
          # not found" em toda tentativa, mesmo com JIT/roles/allowed_networks
          # corretos e confirmados via GET - consistente com o projeto estar
          # atribuido a um cluster diferente. Correcao: descobrir o host
          # tentando a MESMA autenticacao real (JIT) que o dump vai usar,
          # nao um ping sem autenticacao.
          # Percent-encode a senha antes de embuti-la na URI: a API de
          # Management (Authorization: Bearer) nao passa pelo parser de URI,
          # mas aqui o valor vai dentro de postgres://user:SENHA@host/... -
          # qualquer caractere reservado (:, /, @, %, ?, #, etc.) no PAT
          # quebraria o parsing da URI e mandaria uma senha diferente (ou
          # trunca) para o servidor, produzindo o MESMO sintoma de uma senha
          # genuinamente errada ("PAM authentication failed").
          JIT_PAT_ENC=$(jq -rn --arg v "$JIT_PAT" '$v|@uri')
          host=""
          # Host ERRADO e CREDENCIAL errada tem sintomas diferentes e exigem
          # acoes diferentes:
          #   - "tenant/user ... not found" -> este host nao atende este projeto;
          #     continuar procurando faz sentido.
          #   - "PAM authentication failed" -> o host ACERTOU o tenant e recusou
          #     a senha. Continuar procurando so gera ruido, e o erro final
          #     ("nenhum host resolveu o tenant") aponta para o lugar errado.
          # Guardar o host que autenticou-mal permite dizer exatamente o que
          # precisa ser rotacionado.
          auth_host=""
          for idx in 0 1 2 3; do
            candidate="aws-${idx}-${SUPABASE_PROJECT_REGION}.pooler.supabase.com"
            conn_probe="postgres://postgres.${SUPABASE_PROJECT_REF}:${JIT_PAT_ENC}@${candidate}:5432/postgres?options=-c%20jit%3dtrue"
            if PGCONNECT_TIMEOUT=5 psql "$conn_probe" -Atq -v ON_ERROR_STOP=1 -c "SELECT 1" >/tmp/probe-out.txt 2>/tmp/probe-err.txt; then
              if [ "$(cat /tmp/probe-out.txt)" = "1" ]; then
                host="$candidate"
                echo "Host correto encontrado: $candidate (idx=$idx)."
                break
              fi
            fi
            if grep -qiE "PAM authentication failed|password authentication failed" /tmp/probe-err.txt; then
              auth_host="$candidate"
              echo "idx=$idx ($candidate): tenant RESOLVIDO, mas a autenticacao foi recusada."
            else
              echo "idx=$idx ($candidate): sem sucesso de tenant (detalhe sem segredo abaixo)."
            fi
            sed -E "s#${JIT_PAT}#***#g; s#${JIT_PAT_ENC}#***#g" /tmp/probe-err.txt || true
          done
          if [ -z "$host" ] && [ -n "$auth_host" ]; then
            echo "::error::Credencial de banco recusada em ${auth_host} (o tenant do projeto foi resolvido, a senha nao foi aceita). Isto NAO e host errado nem indisponibilidade: rotacione o secret do GitHub usado por este workflow (senha do banco do projeto ${SUPABASE_PROJECT_REF}) e rode novamente."
            exit 1
          fi
          if [ -z "$host" ]; then
            echo "::error::Nenhum host de pooler resolveu o tenant deste projeto (aws-0..3-${SUPABASE_PROJECT_REGION}) e nenhum recusou credencial. Ver detalhes acima (sem segredo)."
            exit 1
          fi
          echo "pooler_host=${host}" >> "$GITHUB_OUTPUT"

      - name: Produzir dump (roles/schema/data)
        if: steps.method.outputs.method == 'jit'
        env:
          JIT_PAT: ${{ secrets.SUPABASE_BACKUP_JIT_PAT }}
          POOLER_HOST: ${{ steps.discover-pooler.outputs.pooler_host }}
        run: |
          set -euo pipefail
          set +x
          # options=-c jit=true (nao "on"): valor exato do exemplo oficial em
          # https://supabase.com/docs/guides/platform/temporary-access. E o
          # sinal que o Supavisor usa para reconhecer a conexao como uma
          # sessao de Temporary Access; "on" (sinonimo booleano valido em
          # Postgres, mas nao o literal esperado aqui) faz o Supavisor cair
          # no roteamento normal de tenant e devolver "tenant/user ... not
          # found", pois postgres.{ref} nao e um tenant valido fora do fluxo
          # de Temporary Access.
          #
          # Senha percent-encoded (jq @uri) antes de embutir na URI - mesmo
          # motivo do step de descoberta: um caractere reservado no PAT bruto
          # quebraria o parsing e mandaria a senha errada ao servidor.
          JIT_PAT_ENC=$(jq -rn --arg v "$JIT_PAT" '$v|@uri')
          conn="postgres://postgres.${SUPABASE_PROJECT_REF}:${JIT_PAT_ENC}@${POOLER_HOST}:5432/postgres?options=-c%20jit%3dtrue"

          mkdir -p /tmp/backup
          supabase db dump --db-url "$conn" -f /tmp/backup/roles.sql --role-only
          supabase db dump --db-url "$conn" -f /tmp/backup/schema.sql
          supabase db dump --db-url "$conn" -f /tmp/backup/data.sql --use-copy --data-only

          for f in roles.sql schema.sql data.sql; do
            size=$(stat -c%s "/tmp/backup/$f")
            echo "  $f: ${size} bytes"
            if [ "$size" -lt 32 ]; then
              echo "::error::/tmp/backup/$f suspeito de vazio (${size} bytes)."
              exit 1
            fi
          done

      - name: Produzir dump via supabase CLI (roles/schema/data)
        if: steps.method.outputs.method == 'cli'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          supabase link --project-ref "${SUPABASE_PROJECT_REF}" >/dev/null
          mkdir -p /tmp/backup
          supabase db dump --linked -f /tmp/backup/roles.sql --role-only
          supabase db dump --linked -f /tmp/backup/schema.sql
          supabase db dump --linked -f /tmp/backup/data.sql --use-copy --data-only
          for f in roles.sql schema.sql data.sql; do
            size=$(stat -c%s "/tmp/backup/$f")
            echo "  $f: ${size} bytes"
            if [ "$size" -lt 32 ]; then
              echo "::error::/tmp/backup/$f suspeito de vazio (${size} bytes)."
              exit 1
            fi
          done
      - name: Manifesto de sanidade (contagens do proprio dump, sem dado sensivel)
        run: |
          set -euo pipefail
          node backend/scripts/backup-manifest.mjs /tmp/backup/data.sql | tee /tmp/backup/manifest.json
      - name: Cifrar com age e remover texto puro
        run: |
          set -euo pipefail
          pub="${{ vars.BACKUP_AGE_PUBLIC_KEY }}"
          mkdir -p /tmp/backup-encrypted
          for f in roles.sql schema.sql data.sql; do
            age -r "$pub" -o "/tmp/backup-encrypted/${f}.age" "/tmp/backup/${f}"
          done
          cp /tmp/backup/manifest.json /tmp/backup-encrypted/manifest.json
          shred -u /tmp/backup/roles.sql /tmp/backup/schema.sql /tmp/backup/data.sql 2>/dev/null || rm -f /tmp/backup/*.sql

      - name: Checksum SHA-256 dos artefatos cifrados
        run: |
          set -euo pipefail
          cd /tmp/backup-encrypted
          sha256sum roles.sql.age schema.sql.age data.sql.age > checksums.sha256
          cat checksums.sha256

      - name: Publicar artifact (somente arquivos cifrados + checksum + manifesto)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jinlong-backup-${{ github.run_id }}
          path: |
            /tmp/backup-encrypted/roles.sql.age
            /tmp/backup-encrypted/schema.sql.age
            /tmp/backup-encrypted/data.sql.age
            /tmp/backup-encrypted/checksums.sha256
            /tmp/backup-encrypted/manifest.json
          retention-days: 30
          if-no-files-found: error
