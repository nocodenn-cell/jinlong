# Item 20 do Plano Mestre de Fechamento dos Gaps — restore drill real, em
# ambiente isolado e descartavel (Postgres 17 efemero neste runner do
# GitHub Actions), nunca em producao.
#
# Baixa o artifact mais recente produzido por backup-scheduled.yml
# (roles/schema/data cifrados com age + checksums.sha256 + manifest.json),
# verifica o checksum, decifra SOMENTE neste runner efemero (nunca em
# producao, nunca fora deste job), restaura na ordem oficial
# (roles -> schema -> data com session_replication_role=replica) e valida
# contagens contra o manifesto de sanidade tirado no momento do backup.
# O runner inteiro (incluindo qualquer arquivo em disco) e destruido pelo
# GitHub ao fim do job; mesmo assim o texto puro e apagado explicitamente
# antes do fim, por defesa em profundidade.
name: Restore drill (item 20)

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch: {}

jobs:
  restore-drill:
    name: Restaura backup mais recente em Postgres 17 efemero
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (scripts de restore)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          sparse-checkout: backend/scripts

      - name: Instalar age e cliente postgres
        run: |
          sudo apt-get update -y
          sudo apt-get install -y age postgresql-client jq

      - name: Localizar run mais recente com sucesso de backup-scheduled.yml
        id: find_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "${{ github.repository }}" \
            --workflow=backup-scheduled.yml --status=success --limit=1 \
            --json databaseId -q '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::Nenhum run com sucesso de backup-scheduled.yml encontrado. Rode o backup primeiro."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Backup a restaurar: run $run_id"

      - name: Baixar artifact do backup
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.find_run.outputs.run_id }}
          pattern: 'jinlong-backup-*'
          path: /tmp/restore
          merge-multiple: true

      - name: Verificar checksum SHA-256 antes de qualquer decifragem
        run: |
          set -euo pipefail
          cd /tmp/restore
          ls -la
          sha256sum -c checksums.sha256
          echo "Checksum OK — todos os 3 arquivos cifrados batem com o checksum publicado no momento do backup."

      - name: Decifrar (somente neste runner efemero)
        env:
          AGE_PRIVATE_KEY: ${{ secrets.BACKUP_AGE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set +x
          mkdir -p /tmp/restore-plain
          echo "$AGE_PRIVATE_KEY" > /tmp/age-key.txt
          chmod 600 /tmp/age-key.txt
          for f in roles schema data; do
            age -d -i /tmp/age-key.txt -o "/tmp/restore-plain/${f}.sql" "/tmp/restore/${f}.sql.age"
          done
          shred -u /tmp/age-key.txt 2>/dev/null || rm -f /tmp/age-key.txt

      - name: Subir Postgres efemero (imagem Supabase, com roles/auth base)
        run: |
          set -euo pipefail
          docker run -d --name restore-drill             -e POSTGRES_PASSWORD=restore-drill-local-only -e PGPASSWORD=restore-drill-local-only             -e JWT_SECRET=restore-drill-local-only-secret-0123456789 -e JWT_EXP=3600             public.ecr.aws/supabase/postgres:17.6.1.165 docker-entrypoint.sh postgres -D /etc/postgresql
          for i in $(seq 1 60); do
            docker exec restore-drill pg_isready -h 127.0.0.1 -U postgres && break
            sleep 2
          done

      - name: Restaurar roles -> schema -> data (backend/scripts/restore-drill.sh)
        id: restore
        run: |
          set -euo pipefail
          start_ts=$(date -u +%s)
          echo "restore_start_iso=$(date -u -d "@$start_ts" '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

          # Colunas que o destino (imagem Supabase do drill) de fato tem; o filtro projeta o COPY nelas.
          docker exec restore-drill psql -U supabase_admin -d postgres -Atq -c "select table_schema||'.'||table_name||'.'||column_name from information_schema.columns where table_schema in ('public','auth')" > /tmp/restore-plain/target-columns.txt
          node backend/scripts/filter-data-dump.mjs /tmp/restore-plain/data.sql /tmp/restore-plain/data.filtered.sql '^(public\.[a-z0-9_]+|auth\.(users|identities))$' /tmp/restore-plain/target-columns.txt
          docker exec restore-drill mkdir -p /tmp/dump
          for f in roles schema data data.filtered; do
            docker cp "/tmp/restore-plain/$f.sql" "restore-drill:/tmp/dump/$f.sql"
          done
          docker cp backend/scripts/restore-drill.sh restore-drill:/tmp/restore-drill.sh
          docker exec -e SKIP_FILTER=1 -e PSQL="psql -U supabase_admin -d postgres" restore-drill             bash /tmp/restore-drill.sh /tmp/dump | tee /tmp/restore-plain/restored-counts.txt

          end_ts=$(date -u +%s)
          echo "restore_end_iso=$(date -u -d "@$end_ts" '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "restore_duration_seconds=$((end_ts - start_ts))" >> "$GITHUB_OUTPUT"
          echo "Restore concluido em $((end_ts - start_ts))s."

      - name: Validar contagens e objetos contra o manifesto do backup
        run: |
          set -euo pipefail
          node backend/scripts/verify-restore-manifest.mjs /tmp/restore/manifest.json /tmp/restore-plain/restored-counts.txt
          objs=$(docker exec restore-drill psql -U supabase_admin -d postgres -Atq -c "SELECT (SELECT count(*) FROM pg_policies WHERE schemaname='public') || ',' || (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public')")
          echo "  policies,functions em public: $objs"
          case "$objs" in 0,*|*,0) echo "::error::Sem RLS/functions restauradas."; exit 1;; esac

      - name: Limpar material em texto puro
        if: always()
        run: |
          shred -u /tmp/restore-plain/*.sql /tmp/restore-plain/*.json 2>/dev/null || rm -f /tmp/restore-plain/* || true
          rm -f /tmp/age-key.txt || true

      - name: Resumo (job summary)
        if: always()
        run: |
          {
            echo "## Restore drill — item 20"
            echo ""
            echo "- Run de backup usado: ${{ steps.find_run.outputs.run_id }}"
            echo "- Inicio do restore: ${{ steps.restore.outputs.restore_start_iso }}"
            echo "- Fim do restore: ${{ steps.restore.outputs.restore_end_iso }}"
            echo "- **Duracao (RTO medido): ${{ steps.restore.outputs.restore_duration_seconds }}s**"
          } >> "$GITHUB_STEP_SUMMARY"

