# Suíte E2E crítica sem passar pelo job "build-and-test" do CI principal.
# Útil em homologação (branch staging) ou execução manual com secrets de staging.
#
# Dispara em push em `staging` ou manualmente. Sempre executa o pipeline crítico quando o job corre.
#
# Secrets (alinhados a ci-pdv-importados / docs/E2E.md):
#   PLAYWRIGHT_NEXT_PUBLIC_SUPABASE_URL, PLAYWRIGHT_NEXT_PUBLIC_SUPABASE_ANON_KEY
#   PLAYWRIGHT_TEST_EMAIL, PLAYWRIGHT_TEST_PASSWORD (gerente — sync-fluxo-gerente)
#   PLAYWRIGHT_CAIXA_TEST_EMAIL, PLAYWRIGHT_CAIXA_TEST_PASSWORD (operador — /caixa)
#   PLAYWRIGHT_SUPABASE_SERVICE_ROLE_KEY, SYNC_ENDPOINT, SYNC_KEY
#   FISCAL_WORKER_KEY (com AUTO_ENQUEUE_FISCAL_ON_SALE=true)
# Opcional: PLAYWRIGHT_BASE_URL (URL do deploy; se definido, não use PLAYWRIGHT_E2E_WITH_DEV)
# Opcional: PLAYWRIGHT_E2E_PRODUTO_CODIGO
name: E2E Playwright-only (crítico)

on:
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - 'pdv-importados/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/e2e-playwright-only.yml'

concurrency:
  group: e2e-playwright-only-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-critical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces na raiz)
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verificar secrets e gravar .env (pipeline crítico)
        env:
          PW_URL: ${{ secrets.PLAYWRIGHT_NEXT_PUBLIC_SUPABASE_URL }}
          PW_ANON: ${{ secrets.PLAYWRIGHT_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PW_GER_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          PW_GER_PASS: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          PW_CX_EMAIL: ${{ secrets.PLAYWRIGHT_CAIXA_TEST_EMAIL }}
          PW_CX_PASS: ${{ secrets.PLAYWRIGHT_CAIXA_TEST_PASSWORD }}
          SR_KEY: ${{ secrets.PLAYWRIGHT_SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_EP: ${{ secrets.SYNC_ENDPOINT }}
          SYNC_K: ${{ secrets.SYNC_KEY }}
          FISCAL_KEY: ${{ secrets.FISCAL_WORKER_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${PW_URL:-}" ] && missing+=(PLAYWRIGHT_NEXT_PUBLIC_SUPABASE_URL)
          [ -z "${PW_ANON:-}" ] && missing+=(PLAYWRIGHT_NEXT_PUBLIC_SUPABASE_ANON_KEY)
          [ -z "${PW_GER_EMAIL:-}" ] && missing+=(PLAYWRIGHT_TEST_EMAIL)
          [ -z "${PW_GER_PASS:-}" ] && missing+=(PLAYWRIGHT_TEST_PASSWORD)
          [ -z "${PW_CX_EMAIL:-}" ] && missing+=(PLAYWRIGHT_CAIXA_TEST_EMAIL)
          [ -z "${PW_CX_PASS:-}" ] && missing+=(PLAYWRIGHT_CAIXA_TEST_PASSWORD)
          [ -z "${SR_KEY:-}" ] && missing+=(PLAYWRIGHT_SUPABASE_SERVICE_ROLE_KEY)
          [ -z "${SYNC_EP:-}" ] && missing+=(SYNC_ENDPOINT)
          [ -z "${SYNC_K:-}" ] && missing+=(SYNC_KEY)
          [ -z "${FISCAL_KEY:-}" ] && missing+=(FISCAL_WORKER_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Defina os secrets ${missing[*]} (ver docs/E2E.md)."
            exit 1
          fi
          FISCAL_EP="${PW_URL%/}/functions/v1/fiscal-worker"
          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$PW_URL"
            printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$PW_ANON"
            printf '%s\n' 'USE_UNIFIED_SALES_FLOW=true'
            printf '%s\n' 'STRICT_MANAGER_DISCOUNT_AUTH=true'
            printf '%s\n' 'AUTO_ENQUEUE_FISCAL_ON_SALE=true'
            printf 'FISCAL_WORKER_ENDPOINT=%s\n' "$FISCAL_EP"
            printf 'FISCAL_WORKER_KEY=%s\n' "$FISCAL_KEY"
          } > pdv-importados/.env.local
          {
            printf 'SYNC_ENDPOINT=%s\n' "$SYNC_EP"
            printf 'SYNC_KEY=%s\n' "$SYNC_K"
          } > pdv-local/.env

      - name: E2E crítico (sync gerente + caixa venda + fluxos)
        env:
          CI: true
          PLAYWRIGHT_E2E_WITH_DEV: ${{ secrets.PLAYWRIGHT_BASE_URL != '' && '0' || '1' }}
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PLAYWRIGHT_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PLAYWRIGHT_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          PLAYWRIGHT_CAIXA_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_CAIXA_TEST_EMAIL }}
          PLAYWRIGHT_CAIXA_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_CAIXA_TEST_PASSWORD }}
          PLAYWRIGHT_E2E_PRODUTO_CODIGO: ${{ secrets.PLAYWRIGHT_E2E_PRODUTO_CODIGO }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PLAYWRIGHT_SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_ENDPOINT: ${{ secrets.SYNC_ENDPOINT }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
          USE_UNIFIED_SALES_FLOW: 'true'
          STRICT_MANAGER_DISCOUNT_AUTH: 'true'
          AUTO_ENQUEUE_FISCAL_ON_SALE: 'true'
        run: npm run test:e2e:critical -w pdv-importados
