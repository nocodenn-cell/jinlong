# Validação mínima do backend Supabase: type-check da Edge + smoke das migrations em Postgres (stub auth).
name: CI backend Supabase

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend-supabase.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend-supabase.yml'

jobs:
  migrations-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Stub auth + apply migrations in order
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f backend/supabase/scripts/ci_stub_supabase_auth.sql
          for f in $(ls -1 backend/supabase/migrations/*.sql | sort); do
            echo "--- $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "OK: todas as migrations aplicaram sem erro."

  edge-sync-outbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Function sync-outbox
        run: deno check backend/supabase/functions/sync-outbox/index.ts

  anti-replay-diagnostic-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect sync-outbox changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            sync_outbox:
              - 'backend/supabase/functions/sync-outbox/**'
              - 'backend/scripts/sync-outbox-anti-replay-diagnostic.ps1'

      - name: Validate required secrets for PR gate
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.changes.outputs.sync_outbox == 'true'
        shell: pwsh
        env:
          SYNC_ENDPOINT: ${{ secrets.SYNC_ENDPOINT }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SYNC_ENDPOINT) -or [string]::IsNullOrWhiteSpace($env:SYNC_KEY)) {
            throw "PR gate bloqueado: configure secrets SYNC_ENDPOINT e SYNC_KEY para validar anti-replay."
          }

      - name: Run anti-replay diagnostic (when secrets are configured)
        if: ${{ secrets.SYNC_ENDPOINT != '' && secrets.SYNC_KEY != '' }}
        shell: pwsh
        env:
          SYNC_ENDPOINT: ${{ secrets.SYNC_ENDPOINT }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: |
          ./backend/scripts/sync-outbox-anti-replay-diagnostic.ps1 -OutputJson
