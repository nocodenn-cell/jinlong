# CI backend Supabase — pipeline mínimo e previsível (demo-safe).
#
# Duas responsabilidades, sem duplicação:
#   1) migrations-and-rls : reset local das migrations (validação básica) + RLS
#      (smoke de governança + suíte de escopo por perfil). Único job de segurança.
#   2) edge-functions-typecheck : type-check Deno das Edge Functions.
name: CI backend Supabase

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/ci-backend-supabase.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/ci-backend-supabase.yml'
  workflow_dispatch:

jobs:
  # Migrations (reset local) + RLS (único job de segurança).
  migrations-and-rls:
    name: Migrations + RLS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Ações fixadas por SHA completo (Sonar githubactions:S7637). Tag: v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Start Supabase local stack
        run: |
          set -euo pipefail
          cd backend
          npx supabase --version
          timeout 240s npx supabase start

      - name: Reset + seed (reaplica migrations do zero — validação básica)
        run: |
          set -euo pipefail
          cd backend
          npx supabase db reset --local --yes

      - name: Smoke SQL de governança RLS
        run: |
          set -euo pipefail
          cd backend
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          PSQL_URL="${POSTGRES_URL:-${DB_URL:-}}"
          if [ -z "$PSQL_URL" ]; then
            echo "::error::Sem URL do Postgres (POSTGRES_URL ou DB_URL). Saída de status:" >&2
            npx supabase status -o env >&2 || true
            exit 1
          fi
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f supabase/scripts/smoke_rls_painel_gerente.sql

      - name: Run RLS scope test suite
        run: |
          set -euo pipefail
          cd backend
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          if [ -z "${POSTGRES_URL:-}" ] && [ -z "${DB_URL:-}" ]; then
            echo "::error::Sem URL do Postgres (POSTGRES_URL ou DB_URL)." >&2
            npx supabase status -o env >&2 || true
            exit 1
          fi
          npm run test:rls-scope -w fastproduct-backend

      - name: Diagnóstico em falha (logs + status)
        if: failure()
        run: |
          set +e
          cd backend
          echo "=== supabase status ==="
          npx supabase status || true
          echo "=== docker ps -a ==="
          docker ps -a || true
          echo "=== logs dos containers supabase ==="
          for c in $(docker ps -a --format '{{.Names}}' | rg supabase); do
            echo "--- $c ---"
            docker logs "$c" --tail 200 || true
          done

      - name: Teardown Supabase local
        if: always()
        run: |
          set +e
          cd backend
          npx supabase stop --project-id fastproduct --no-backup

  # Type-check das Edge Functions (Deno).
  edge-functions-typecheck:
    name: Edge typecheck (Deno)
    runs-on: ubuntu-latest
    steps:
      # Tag: v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # Tag: v2.0.4 (major v2)
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions (sync-outbox + validar-gerente + fiscal-worker)
        run: |
          deno check --config backend/supabase/functions/sync-outbox/deno.json backend/supabase/functions/sync-outbox/index.ts
          deno check --config backend/supabase/functions/validar-gerente/deno.json backend/supabase/functions/validar-gerente/index.ts
          deno check --config backend/supabase/functions/fiscal-worker/deno.json backend/supabase/functions/fiscal-worker/index.ts
