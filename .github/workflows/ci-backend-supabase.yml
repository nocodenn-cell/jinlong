# Validação mínima do backend Supabase: type-check da Edge + smoke das migrations em Postgres (stub auth).
#
# Job migration-remote-drift (Ubuntu + Node):
# - Secrets obrigatórios em contexto interno: SUPABASE_ACCESS_TOKEN (token de conta) e
#   SUPABASE_MIGRATION_CHECK_PROJECT_REF (ref do projeto staging/homolog).
# - Falha se secrets ausentes (interno) ou se Local≠Remote.
# - PR de fork: job é pulado (secrets do base não são injetados).
#
# Job anti-replay (Windows + PowerShell):
# - Secrets do repositório: SYNC_ENDPOINT (URL da função sync-outbox), SYNC_KEY (mesmo da Edge).
# - PR interno que altera sync-outbox ou o script de diagnóstico: falha se esses secrets estiverem vazios (gate).
# - Push/PR com secrets preenchidos: executa backend/scripts/sync-outbox-anti-replay-diagnostic.ps1.
# - Forks: o gate de secrets não exige SYNC_* no PR de fork (head.repo != github.repository); o passo de diagnóstico só roda se os secrets existirem no repo base (geralmente não expostos a forks).
name: CI backend Supabase

# Cancela execuções obsoletas do mesmo ref. Sem isto, cada commit intermediário
# de uma PR deixa um run completo rodando até o fim mesmo já estando superado —
# principal driver do consumo de minutos que estourou a cota (ver P0-1).
# Em `main` NÃO cancela: um commit que já entrou precisa ser validado até o fim.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege explícito. O default do repo hoje já é `read`, mas isso é uma
# configuração de UI que pode mudar sem revisão de código; declarar aqui trava o
# escopo do GITHUB_TOKEN junto do workflow. Este workflow só lê o repositório.
permissions:
  contents: read

# Gate de merge: roda em pull_request, que já testa o resultado do merge.
# Sem push para `main` — seria revalidar o mesmo código. workflow_dispatch
# permanece para execução sob demanda.
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/ci-backend-supabase.yml'
  workflow_dispatch:

jobs:
  supabase-local-gates:
    name: Supabase local gates (RLS smoke + scope + REST)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          # Runner às vezes já traz psql; senão apt com retry — mirrors
          # do GitHub Hosted podem travar (hang >20min tip 9334577d;
          # timeout 124 no tip 82ce598a).
          if command -v psql >/dev/null 2>&1; then
            psql --version
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "apt postgresql-client attempt ${attempt}/3"
            if sudo timeout 180 apt-get update -y \
              && sudo timeout 240 apt-get install -y --no-install-recommends postgresql-client; then
              psql --version
              exit 0
            fi
            echo "apt attempt ${attempt} falhou; backoff..."
            sleep $((attempt * 20))
          done
          echo "::error::Falha ao instalar postgresql-client após 3 tentativas."
          exit 1

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Financial store ledger regression (PostgreSQL in memory)
        run: npm run test:financeiro-loja -w fastproduct-backend

      - name: Enforce seed password secret for internal PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CI_RLS_SMOKE_SEED_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${CI_RLS_SMOKE_SEED_PASSWORD:-}" ] || (
            echo "Secret ausente: PLAYWRIGHT_TEST_PASSWORD (senha E2E / smoke RLS local)."
            exit 1
          )

      - name: Start Supabase local stack (single pull, retry ECR)
        run: bash backend/scripts/ci-supabase-local-start.sh

      - name: Reset + seed determinístico (local)
        run: |
          set -euo pipefail
          cd backend
          npx supabase db reset --local --yes

      - name: Smoke SQL de governança RLS
        run: |
          set -euo pipefail
          cd backend
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          PSQL_URL="${POSTGRES_URL:-${DB_URL:-}}"
          if [ -z "$PSQL_URL" ]; then
            echo "::error::Sem URL do Postgres (POSTGRES_URL ou DB_URL)." >&2
            npx supabase status -o env >&2 || true
            exit 1
          fi
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f supabase/scripts/smoke_rls_painel_gerente.sql

      - name: Export database types for schema diagnostics
        run: cd backend && npx supabase gen types typescript --local > ../database.types.generated.ts

      - name: Upload database schema diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: database-types-local
          path: database.types.generated.ts
          retention-days: 3

      # Achado de code review (#337, P2): registrar este check só em
      # `test:financial` o deixava restrito ao guard de fork PR (mesma
      # condição do seed de usuários — ver "Financial regression gate"
      # abaixo). Só introspecção de catálogo (pg_proc/has_function_privilege),
      # sem seed nem secrets — roda sem guard, para que uma fork PR que
      # reabra um GRANT a anon não passe silenciosamente.
      - name: Security regression — anon grant em RPCs que confiam em p_operador_id
        run: |
          set -euo pipefail
          cd backend
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          PSQL_URL="${POSTGRES_URL:-${DB_URL:-}}"
          if [ -z "$PSQL_URL" ]; then
            echo "::error::Sem URL do Postgres (POSTGRES_URL ou DB_URL)." >&2
            exit 1
          fi
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f scripts/fase2-coalesce-operador-id-regressao.test.sql

      # C1/C2 (auditoria 2026-09-30): guarda de classe SECURITY DEFINER sem identidade,
      # ACL padrão fail-closed e suspensão de vendas no trigger de `vendas`. Só catálogo
      # + transação com ROLLBACK; roda sem guard de fork PR.
      - name: Security regression — SECDEF sem identidade e suspensão de vendas
        run: |
          set -euo pipefail
          cd backend
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          PSQL_URL="${POSTGRES_URL:-${DB_URL:-}}"
          if [ -z "$PSQL_URL" ]; then
            echo "::error::Sem URL do Postgres (POSTGRES_URL ou DB_URL)." >&2
            exit 1
          fi
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f scripts/c1-secdef-sem-identidade.test.sql
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f scripts/c2-suspensao-vendas-trigger.test.sql

      # PR-2D (C3): devolução paga pelo caixa pagador (regra 0/1/N), caixa fechado imutável e conciliação D-13.
      # Transação com ROLLBACK, dados sintéticos; roda sem guard de fork PR. A concorrência com 2 sessões reais
      # (backend/scripts/devolucao-concorrencia.sh) grava dados commitados e por isso roda só manualmente/noturno.
      - name: Devolução — caixa pagador e conciliação D-13 (A-1…A-9)
        run: |
          set -euo pipefail
          cd backend
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          PSQL_URL="${POSTGRES_URL:-${DB_URL:-}}"
          if [ -z "$PSQL_URL" ]; then
            echo "::error::Sem URL do Postgres (POSTGRES_URL ou DB_URL)." >&2
            exit 1
          fi
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f scripts/devolucao-d13-caixa-desembolso.test.sql
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f scripts/listar-caixas-elegiveis-desembolso.test.sql

      - name: Test RLS scope by profile
        run: |
          set -euo pipefail
          cd backend
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          if [ -z "${POSTGRES_URL:-}" ] && [ -z "${DB_URL:-}" ]; then
            echo "::error::Sem URL do Postgres." >&2
            exit 1
          fi
          npm run test:rls-scope -w fastproduct-backend

      - name: Seed Auth + usuarios (gerente/operador E2E)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CI_RLS_SMOKE_SEED_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          cd backend
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL="${API_URL:-${SUPABASE_URL:-}}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          export SEED_DEV_PASSWORD="${CI_RLS_SMOKE_SEED_PASSWORD}"
          node ../pdv-importados/scripts/seed-dev-users.mjs

      - name: REST RLS smoke (local stack)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CI_RLS_SMOKE_REQUIRED: 'true'
          CI_RLS_SMOKE_SEED_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          cd backend
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL="${API_URL:-${SUPABASE_URL:-}}"
          export SUPABASE_ANON_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          export SEED_DEV_PASSWORD="${CI_RLS_SMOKE_SEED_PASSWORD}"
          eval "$(node scripts/fetch-rls-smoke-jwts.mjs | sed 's/^/export /')"
          node scripts/p0-rls-rest-smoke.mjs

      # Gate financeiro: contrato de idempotência 1A, invariante de totais 1B,
      # reconciliação AR 2A, reconciliação AP 2B e os gates adversariais dos
      # P0/P1 (escrita direta do contador, writer legado, venda offline em
      # dinheiro, contador x E(c), invariante de preço, matriz de perfis,
      # colisão de chave AP, retry offline, estorno AR/AP e fault injection).
      # Estas suítes existiam no repositório sem nenhum invocador — as Fases
      # 1A-2B foram declaradas PASS a partir de execuções manuais.
      #
      # Roda DEPOIS do seed de usuários: as suítes exigem GERENTE/OPERADOR/DONO
      # ativos na mesma loja que tem produtos precificados. `test:rls-scope`
      # semeia usuários numa loja própria, sem catálogo, e não serve de base.
      # Mesma condição do smoke REST: em PR de fork o seed não roda.
      - name: Financial regression gate
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          cd backend
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          export DB_URL="${POSTGRES_URL:-${DB_URL:-}}"
          if [ -z "${DB_URL:-}" ]; then
            echo "::error::Sem URL do Postgres para o gate financeiro." >&2
            exit 1
          fi
          npm run test:financial -w fastproduct-backend

      # Onda A (integridade comercial): lista e KPIs de vendas por identidade de venda
      # (`listar_vendas_gerente` / `kpis_vendas_gerente`, migration 20260930120000), incluindo devolução
      # mista (meio + abatimento de AR) e autorização por loja. Fixture sintética em transação com
      # ROLLBACK sobre o seed determinístico; roda sem guard de fork PR.
      - name: Vendas — lista e KPIs por venda (Onda A)
        run: |
          set -euo pipefail
          cd backend
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          PSQL_URL="${POSTGRES_URL:-${DB_URL:-}}"
          if [ -z "$PSQL_URL" ]; then
            echo "::error::Sem URL do Postgres (POSTGRES_URL ou DB_URL)." >&2
            exit 1
          fi
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f scripts/vendas-lista-kpis-por-venda.test.sql

      # F-5: o gate de tipos em `financialRpcContract.ts` afirma adapters x tipos.
      # Uma migration que muda a assinatura de uma RPC sem regenerar os tipos
      # passava silenciosamente, porque os dois lados seguiam consistentes entre
      # si. Este passo compara o arquivo versionado com o schema do banco.
      - name: Types drift gate (database x database.types.ts)
        run: |
          set -euo pipefail
          cd backend
          npm run check:types-drift -w fastproduct-backend

      # PR-2D: concorrência da devolução com sessões psql reais (serialização por caixa, mesma venda disputada,
      # caixas distintos sem bloqueio). O script grava dados COMMITADOS; por isso roda como ÚLTIMO passo de teste do
      # job (nada que dependa do estado do banco vem depois; o stack é destruído no teardown). `createdb -T` não serve:
      # os serviços do Supabase mantêm conexões no banco `postgres` e o CREATE DATABASE ... TEMPLATE falha.
      # Regressão guardada: trocar `FOR NO KEY UPDATE` por `FOR UPDATE` no SELECT do caixa pagador estoura o
      # lock_timeout no cenário 3 (FK KEY SHARE de venda_pos_venda_operacoes.caixa_id).
      - name: Devolução — concorrência (PR-2D, sessões reais)
        run: |
          set -euo pipefail
          eval "$(cd backend && npx supabase status -o env | sed 's/^/export /')"
          export DB_URL="${POSTGRES_URL:-${DB_URL:-}}"
          if [ -z "${DB_URL:-}" ]; then
            echo "::error::Sem URL do Postgres para o teste de concorrência." >&2
            exit 1
          fi
          bash backend/scripts/devolucao-concorrencia.sh

      # N1 (migration 20261009180000): o OPERADOR não lê produtos.preco_custo por nenhum caminho (coluna, embed,
      # view, RPC, alerta), GERENTE/DONO/ADMIN leem pela view produtos_custos, o PDV conclui venda sem ler custo
      # e o isolamento entre lojas é mantido. Provisiona uma senha aleatória nos usuários do seed (só neste stack
      # efêmero). Deixa uma venda de teste — por isso roda depois dos demais gates de dados.
      - name: N1 — preço de custo protegido (smoke adversarial por perfil)
        run: |
          set -euo pipefail
          cd backend
          eval "$(npx supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL="${API_URL:-}"
          export SEED_PASSWORD="$(openssl rand -hex 16)"
          export PROVISION_PASSWORDS=1
          node scripts/n1-preco-custo-authz-smoke.mjs

      - name: Diagnóstico em falha (logs + status)
        if: failure()
        run: |
          set +e
          cd backend
          npx supabase status || true
          docker ps -a || true
          for c in $(docker ps -a --format '{{.Names}}' | grep supabase); do
            echo "--- $c ---"
            docker logs "$c" --tail 200 || true
          done

      - name: Teardown Supabase local
        if: always()
        run: |
          set +e
          cd backend
          npx supabase stop --project-id fastproduct --no-backup

  edge-functions-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Ações fixadas por SHA completo (Sonar githubactions:S7637). Tag de referência: v4
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Tag de referência: v2.0.4 (major v2)
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      - name: Type-check Edge Functions (sync-outbox + validar-gerente + fiscal-worker)
        run: |
          deno check --config backend/supabase/functions/sync-outbox/deno.json backend/supabase/functions/sync-outbox/index.ts
          deno check --config backend/supabase/functions/validar-gerente/deno.json backend/supabase/functions/validar-gerente/index.ts
          deno check --config backend/supabase/functions/fiscal-worker/deno.json backend/supabase/functions/fiscal-worker/index.ts

      # `deno check` sozinho nao pega quebra de runtime: 680984c7 trocou o import
      # de bcryptjs, passou no type-check e derrubou toda autorizacao de gerente
      # por ~3 meses. Este passo executa os testes Deno do _shared (ate entao
      # existiam testes no repo sem nenhum invocador em CI).
      - name: Test Edge Functions (_shared)
        # `--no-check`: o job nao roda `npm ci`, entao o type-check do teste nao
        # resolve `npm:@types/node` (dependencia transitiva de @types/bcryptjs).
        # O type-check de producao ja e feito no passo anterior; aqui o que
        # importa e a execucao real.
        # `--no-lock`: executar o modulo resolve submodulos que o `deno check`
        # nunca tocou, e o lockfile versionado esta no formato v4 (o backend
        # fixa `deno@2.2.2`, que nao le v5). Sem isto, o passo reescreveria o
        # lock e criaria churn/quebra por efeito colateral.
        run: deno test --no-lock --no-check --allow-net backend/supabase/functions/_shared/

  outbox-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Ações fixadas por SHA completo (Sonar githubactions:S7637). Tag de referência: v4
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Contract smoke (sync-outbox payload v1)
        run: node backend/scripts/sync-outbox-contract-smoke.mjs

  migration-remote-drift:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Ações fixadas por SHA completo (Sonar githubactions:S7637). Tag de referência: v4
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Tag de referência: v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Enforce required secrets for drift gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_MIGRATION_CHECK_PROJECT_REF: ${{ secrets.SUPABASE_MIGRATION_CHECK_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_MIGRATION_CHECK_PROJECT_REF:-}" ]; then
            echo "Secrets obrigatórios ausentes: SUPABASE_ACCESS_TOKEN e/ou SUPABASE_MIGRATION_CHECK_PROJECT_REF."
            exit 1
          fi

      - name: Link + compare Local vs Remote
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_MIGRATION_CHECK_PROJECT_REF: ${{ secrets.SUPABASE_MIGRATION_CHECK_PROJECT_REF }}
        run: |
          set -euo pipefail
          cd backend
          npx supabase link --project-ref "${SUPABASE_MIGRATION_CHECK_PROJECT_REF}"
          node scripts/p0-migration-status.mjs

  anti-replay-diagnostic-gate:
    runs-on: windows-latest
    timeout-minutes: 15
    # dorny/paths-filter usa a API de PR; sem pull-requests:read o token falha com
    # "Resource not accessible by integration" em PRs internos.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Ações fixadas por SHA completo (Sonar githubactions:S7637). Tag de referência: v4
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Detect sync-outbox changes
        id: changes
        # Tag de referência: v3
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        with:
          filters: |
            sync_outbox:
              - 'backend/supabase/functions/sync-outbox/**'
              - 'backend/scripts/sync-outbox-anti-replay-diagnostic.ps1'

      - name: Validate required secrets for PR gate
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.changes.outputs.sync_outbox == 'true'
        shell: pwsh
        env:
          SYNC_ENDPOINT: ${{ secrets.SYNC_ENDPOINT }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SYNC_ENDPOINT) -or [string]::IsNullOrWhiteSpace($env:SYNC_KEY)) {
            throw "PR gate bloqueado: configure secrets SYNC_ENDPOINT e SYNC_KEY para validar anti-replay."
          }

      # Não use `secrets.*` em `if:` — o contexto `secrets` não é permitido em condicionais do workflow.
      - name: Run anti-replay diagnostic (when secrets are configured)
        shell: pwsh
        env:
          SYNC_ENDPOINT: ${{ secrets.SYNC_ENDPOINT }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SYNC_ENDPOINT) -or [string]::IsNullOrWhiteSpace($env:SYNC_KEY)) {
            Write-Host "⚠️ Secrets SYNC_ENDPOINT ou SYNC_KEY não configurados. Pulando diagnóstico."
            exit 0
          }
          ./backend/scripts/sync-outbox-anti-replay-diagnostic.ps1 -OutputJson
