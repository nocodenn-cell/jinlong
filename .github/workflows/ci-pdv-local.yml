# CI do app desktop em pdv-local (testes unitários front + build Vite).
#
# `rust-tauri-checks` roda em windows-latest (multiplicador 2x de minutos) e
# levava 8min06s medidos = ~17 min faturados por execução. O desktop está fora
# do escopo D0 (Jinlong/02_ESTADO_ATUAL.md), então validá-lo em todo PR é o pior
# custo/benefício do pipeline. Passou a rodar semanalmente, sob demanda
# (workflow_dispatch) ou em PR que receba a label `run-tauri`.
name: CI pdv-local

on:
  push:
    branches: [main]
    paths:
      - 'pdv-local/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/ci-pdv-local.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'pdv-local/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/ci-pdv-local.yml'
  schedule:
    # Segunda-feira, 06:00 UTC — cobertura semanal do toolchain Rust/Tauri.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build-and-test:
    # Não roda no agendamento semanal: lá o alvo é só o toolchain Rust.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      # Sonar githubactions:S7637 — SHA do release da tag indicada
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces na raiz)
        run: npm ci

      - name: Typecheck, unit tests e build (Turborepo)
        run: npx turbo run typecheck test build --filter=pdv-local

      - name: Coverage (Vitest + lcov)
        run: npm run test:coverage -w pdv-local

  rust-tauri-checks:
    # windows-latest custa 2x. Só no cron semanal, sob demanda, ou em PR
    # explicitamente marcado com a label `run-tauri`.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-tauri'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pdv-local/src-tauri

      - name: Cargo test (core local sync/db)
        working-directory: pdv-local/src-tauri
        run: cargo test --lib --verbose

      - name: Cargo build mínimo (Tauri binary)
        working-directory: pdv-local/src-tauri
        run: cargo build --bin pdv-local --locked --verbose
