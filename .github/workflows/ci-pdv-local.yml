# CI do app desktop em pdv-local (testes unitários front + build Vite).
#
# `rust-tauri-checks` roda em windows-latest (multiplicador 2x de minutos) e
# levava 8min06s medidos = ~17 min faturados por execução. O desktop está fora
# do escopo D0 (Jinlong/02_ESTADO_ATUAL.md), então validá-lo em todo PR é o pior
# custo/benefício do pipeline. Passou a rodar semanalmente, sob demanda
# (workflow_dispatch) ou em PR que receba a label `run-tauri`.
name: CI pdv-local

# Cancela execuções obsoletas do mesmo ref. Sem isto, cada commit intermediário
# de uma PR deixa um run completo rodando até o fim mesmo já estando superado —
# principal driver do consumo de minutos que estourou a cota (ver P0-1).
# Em `main` NÃO cancela: um commit que já entrou precisa ser validado até o fim.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege explícito — ver nota em ci-backend-supabase.yml.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'pdv-local/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/ci-pdv-local.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'pdv-local/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/ci-pdv-local.yml'
  schedule:
    # Segunda-feira, 06:00 UTC — cobertura semanal do toolchain Rust/Tauri.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build-and-test:
    # Não roda no agendamento semanal: lá o alvo é só o toolchain Rust.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Sonar githubactions:S7637 — SHA do release da tag indicada
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces na raiz)
        run: npm ci

      - name: Typecheck, unit tests e build (Turborepo)
        run: npx turbo run typecheck test build --filter=pdv-local

      - name: Coverage (Vitest + lcov)
        run: npm run test:coverage -w pdv-local

  rust-tauri-checks:
    # windows-latest custa 2x. Só no cron semanal, sob demanda, ou em PR
    # explicitamente marcado com a label `run-tauri`.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-tauri'))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Rust toolchain
        # Pinado por SHA: `@stable` é uma branch mutável — quem controla o repo da
        # action pode trocar o código executado no runner sem alterar a referência.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Cargo registry/target
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: pdv-local/src-tauri

      - name: Cargo test (core local sync/db)
        working-directory: pdv-local/src-tauri
        run: cargo test --lib --verbose

      - name: Cargo build mínimo (Tauri binary)
        working-directory: pdv-local/src-tauri
        run: cargo build --bin pdv-local --locked --verbose
