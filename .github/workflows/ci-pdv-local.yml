# CI do app desktop em pdv-local (testes unitários front + build Vite).
# Layer 1 — job build-and-test é bloqueante (Core CI local/desktop).
# Layer 3 — job rust-tauri-checks tem continue-on-error (Windows, build demorado).
name: CI pdv-local

on:
  push:
    branches: [main, develop]
    paths:
      - 'pdv-local/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/ci-pdv-local.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'pdv-local/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/ci-pdv-local.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Sonar githubactions:S7637 — SHA do release da tag indicada
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces na raiz)
        env:
          SENTRYCLI_SKIP_DOWNLOAD: '1'
        run: npm ci

      - name: Typecheck, unit tests e build (Turborepo)
        run: npx turbo run typecheck test build --filter=pdv-local

      - name: Coverage (Vitest + lcov)
        run: npm run test:coverage -w pdv-local

  rust-tauri-checks:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pdv-local/src-tauri

      - name: Cargo test (core local sync/db)
        working-directory: pdv-local/src-tauri
        run: cargo test --lib --verbose

      - name: Cargo build mínimo (Tauri binary)
        working-directory: pdv-local/src-tauri
        run: cargo build --bin pdv-local --locked --verbose
