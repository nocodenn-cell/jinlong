# CI do app desktop em pdv-local (testes unitários front + build Vite).
name: CI pdv-local

on:
  push:
    branches: [main, develop]
    paths:
      - 'pdv-local/**'
      - '.github/workflows/ci-pdv-local.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'pdv-local/**'
      - '.github/workflows/ci-pdv-local.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdv-local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pdv-local/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build
