# CI do app desktop em pdv-local (testes unitários front + build Vite).
name: CI pdv-local

on:
  push:
    branches: [main, develop]
    paths:
      - 'pdv-local/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/ci-pdv-local.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'pdv-local/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/ci-pdv-local.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Sonar githubactions:S7637 — SHA do release da tag indicada
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (workspaces na raiz)
        run: npm ci

      - name: Unit tests & build (Turborepo)
        run: npx turbo run test build --filter=pdv-local
