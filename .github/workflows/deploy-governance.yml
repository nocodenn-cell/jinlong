# Guarda de governança de deploy — ver docs/ops/deploy-governance.md.
# Status (2026-11-06): o dono confirmou no painel do Supabase que "Deploy to production" está DESATIVADO
# (alteração salva). A publicação automática não é mais tratada como risco ativo; este check continua
# como barreira de governança: impede que um PR que toque migrations, functions, config.toml ou o manifesto
# entre na main sem o label explícito deploy-prod:aprovado, e protege as migrations adiadas
# (ex.: 20261010120000) contra edição/remoção. Este comentário não altera a lógica do check.
name: Deploy governance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Testes do guard
        run: node --test scripts/ops/deploy-governance-guard.test.mjs
      - name: Guard (caminhos de produção + migrations adiadas)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/ops/deploy-governance-guard.mjs
