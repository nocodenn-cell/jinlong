name: Secret scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks

      - name: Gitleaks scan
        id: gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            echo "scan_range=${BASE_SHA}...${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            echo "scan_mode=pr" >> "$GITHUB_OUTPUT"
            gitleaks detect --source=. -c .gitleaks.toml --redact \
              --log-opts="${BASE_SHA}...${HEAD_SHA}" \
              --report-format sarif --report-path gitleaks.sarif \
              --report-format json --report-path gitleaks.json || true
            gitleaks detect --source=. -c .gitleaks.toml --redact \
              --log-opts="${BASE_SHA}...${HEAD_SHA}"
          else
            echo "scan_range=full" >> "$GITHUB_OUTPUT"
            echo "scan_mode=push" >> "$GITHUB_OUTPUT"
            gitleaks detect --source=. -c .gitleaks.toml --redact \
              --report-format sarif --report-path gitleaks.sarif \
              --report-format json --report-path gitleaks.json || true
            gitleaks detect --source=. -c .gitleaks.toml --redact
          fi

      - name: Sumário estruturado de findings
        if: always()
        run: |
          if [ -f gitleaks.json ]; then
            count=$(python3 -c "import json,sys; d=json.load(open('gitleaks.json')); print(len(d) if isinstance(d,list) else 0)" 2>/dev/null || echo "?")
            echo "### Gitleaks — $count finding(s)" >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'EOF'
          import json, sys, os
          try:
              with open("gitleaks.json") as f:
                  findings = json.load(f)
          except Exception:
              findings = []
          if not isinstance(findings, list) or not findings:
              print("Nenhum finding detectado ou arquivo vazio.", file=sys.stderr)
              sys.exit(0)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n| RuleID | File | Commit | Line |\n")
              out.write("|--------|------|--------|------|\n")
              for f in findings[:50]:
                  rule = f.get("RuleID", f.get("ruleId", "?"))
                  path = f.get("File", f.get("file", "?"))
                  commit = (f.get("Commit", f.get("commit", "")) or "")[:8]
                  line = f.get("StartLine", f.get("startLine", "?"))
                  out.write(f"| {rule} | `{path}` | `{commit}` | {line} |\n")
          EOF
          else
            echo "gitleaks.json não gerado (scan abortou antes de produzir relatório)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload gitleaks artifacts (SARIF + JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: |
            gitleaks.sarif
            gitleaks.json
          if-no-files-found: ignore
          retention-days: 7
