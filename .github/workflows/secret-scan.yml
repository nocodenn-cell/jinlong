name: Secret scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Em pull_request, escaneia o HEAD REAL da PR (não o merge commit sintético),
      # eliminando a ambiguidade merge-commit vs head-commit.
      # fetch-depth: 0 garante histórico completo para resolver o range BASE..HEAD.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks version

      # Resolve BASE/HEAD deterministicamente e delega ao MESMO script usado localmente.
      # PR  : base.sha .. head.sha           -> apenas commits introduzidos pela PR
      # push: event.before .. event.after    -> apenas commits novos do push
      # push sem base válida (1º push/force): apenas o commit do topo
      - name: Gitleaks scan
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO="0000000000000000000000000000000000000000"
          if [ -n "${PR_BASE}" ]; then
            BASE="${PR_BASE}"; HEAD="${PR_HEAD}"
          elif [ -n "${PUSH_BEFORE}" ] && [ "${PUSH_BEFORE}" != "${ZERO}" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            BASE="${PUSH_BEFORE}"; HEAD="${PUSH_AFTER}"
          else
            BASE="${PUSH_AFTER}~1"; HEAD="${PUSH_AFTER}"
          fi
          bash scripts/secret-scan.sh "${BASE}" "${HEAD}"
