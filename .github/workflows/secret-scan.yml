name: Secret scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks

      - name: Gitleaks scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            # PR: scan only new commits, not full history
            gitleaks detect --source=. -c .gitleaks.toml --redact \
              --log-opts="${BASE_SHA}...${HEAD_SHA}" \
              --report-format sarif --report-path gitleaks.sarif || true
            gitleaks detect --source=. -c .gitleaks.toml --redact \
              --log-opts="${BASE_SHA}...${HEAD_SHA}"
          else
            # push to main/develop: full scan with allowlist
            gitleaks detect --source=. -c .gitleaks.toml --redact \
              --report-format sarif --report-path gitleaks.sarif || true
            gitleaks detect --source=. -c .gitleaks.toml --redact
          fi

      - name: Upload gitleaks SARIF (findings detail)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          retention-days: 7
