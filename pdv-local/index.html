<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>PDV Local - Caixa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      #37 — Splash de boot (Tauri). Marca Jīn Lóng estática + animação sutil,
      renderizada no segundo zero (sem React/asset externo) para o usuário ver a
      marca completa enquanto o app monta. main.tsx remove o splash após pintar.
      Tudo inline para não depender de bundle/CSS carregado.
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #020617; }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Cinzel', 'Times New Roman', serif;
        background:
          radial-gradient(circle at 50% 32%, rgba(251, 191, 36, 0.12) 0%, transparent 55%),
          linear-gradient(180deg, #1f2937 0%, #0b1220 58%, #020617 100%);
        transition: opacity 0.45s ease;
      }
      #boot-splash.boot-splash--hidden { opacity: 0; pointer-events: none; }
      .boot-splash__card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 42px 60px;
        border-radius: 20px;
        background: rgba(15, 23, 42, 0.55);
        border: 1px solid rgba(251, 191, 36, 0.16);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.05),
          0 24px 70px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 0 rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      .boot-splash__mark {
        font-size: 68px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #d4af37;
        text-shadow: 0 0 26px rgba(212, 175, 55, 0.38);
        animation: boot-breathe 2.6s ease-in-out infinite;
      }
      .boot-splash__wordmark {
        font-size: 20px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #bfa76a;
      }
      .boot-splash__subtitle {
        margin-top: 2px;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(148, 163, 184, 0.7);
      }
      .boot-splash__bar {
        margin-top: 12px;
        width: 128px;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(148, 163, 184, 0.18);
      }
      .boot-splash__bar::after {
        content: '';
        display: block;
        height: 100%;
        width: 38%;
        background: linear-gradient(90deg, transparent, #d4af37, transparent);
        animation: boot-sweep 1.15s ease-in-out infinite;
      }
      @keyframes boot-breathe {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.86; transform: scale(1.04); }
      }
      @keyframes boot-sweep {
        0% { transform: translateX(-130%); }
        100% { transform: translateX(360%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__mark { animation: none; }
        .boot-splash__bar::after { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-splash__card">
        <div class="boot-splash__mark">金龍</div>
        <div class="boot-splash__wordmark">Jīn Lóng</div>
        <div class="boot-splash__subtitle">PDV Local</div>
        <div class="boot-splash__bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
