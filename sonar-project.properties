# Exclui SQL do backend Supabase da detecção de duplicação (CPD).
# - Migrations: DDL versionado e repetitivo por natureza (CREATE POLICY, GRANT, etc.).
# - scripts/*.sql: smokes, verify e homologação costumam ecoar padrões das migrations — CPD
#   dispara falso "copy-paste" e quebra o Quality Gate (≤3% em código novo) sem ganho real.
# Edge (Deno/TS) permanece sujeita ao CPD.
sonar.cpd.exclusions=backend/supabase/**/*.sql

# Exclui o adaptador WebUSB: acesso direto a hardware via navigator["usb"] é
# intencional e foi revisado manualmente. sonar.exclusions remove o arquivo
# da análise para evitar o hotspot S5042 (WebUSB API).
sonar.exclusions=**/webUsbAdapter.ts
