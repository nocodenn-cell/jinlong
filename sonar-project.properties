# Exclui SQL do backend Supabase da detecção de duplicação (CPD).
# - Migrations: DDL versionado e repetitivo por natureza (CREATE POLICY, GRANT, etc.).
# - scripts/*.sql: smokes, verify e homologação costumam ecoar padrões das migrations — CPD
#   dispara falso "copy-paste" e quebra o Quality Gate (≤3% em código novo) sem ganho real.
# Edge (Deno/TS) permanece sujeita ao CPD.
sonar.cpd.exclusions=backend/supabase/**/*.sql

# Exclui migrations SQL de toda a análise de segurança:
# - SECURITY DEFINER é intencional nas RPCs do Supabase (necessário para bypassar RLS)
# - As migrações são DDL versionado revisado manualmente antes de aplicar
sonar.exclusions=**/*.sql,pdv-importados/stores/suspensaoStore.ts,pdv-importados/components/caixa/FilaEstacionariaDrawer.tsx,pdv-importados/components/caixa/MiniFilaEstacionaria.tsx
