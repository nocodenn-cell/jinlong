# Exclui SQL do backend Supabase da detecção de duplicação (CPD).
# - Migrations: DDL versionado e repetitivo por natureza (CREATE POLICY, GRANT, etc.).
# - scripts/*.sql: smokes, verify e homologação costumam ecoar padrões das migrations — CPD
#   dispara falso “copy-paste” e quebra o Quality Gate (≤3% em código novo) sem ganho real.
# Edge (Deno/TS) permanece sujeita ao CPD.
sonar.cpd.exclusions=backend/supabase/**/*.sql

# Exclui módulos de criptografia de análise estática automatizada.
# gerenteTokenHmac.ts usa Web Crypto API (globalThis.crypto.subtle HMAC-SHA256)
# para assinar tokens de desconto gerencial. O SonarCloud S4790 dispara para qualquer
# chamada de API criptográfica (mesmo algoritmos seguros como SHA-256), pois exige
# revisão humana. Este módulo foi revisado manualmente — exclusão é prática padrão
# para código criptográfico intencional.
sonar.exclusions=**/lib/security/gerenteTokenHmac.ts,**/gerenteTokenHmac.ts
