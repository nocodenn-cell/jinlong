<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fornecedores — Jīn Lóng</title>
<link rel="icon" href="../../assets/favicon-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../components.css">
<link rel="stylesheet" href="../gerente/gerente-extras.css">
<link rel="stylesheet" href="../vendas-melhorada/vendas-melhorada.css">
<link rel="stylesheet" href="../clientes-page/clientes.css">
<link rel="stylesheet" href="fornecedores.css">
</head>
<body>
  <div class="bg-oriental-clouds" style="min-height:100vh;">
    <header class="ger-topbar">
      <div class="ger-brand">
        <img src="../../assets/brand-double-dragon.png" alt="" />
        <div class="ger-brand-text">
          <div class="ger-brand-han">金龍</div>
          <div class="ger-brand-main">Jīn Lóng</div>
        </div>
      </div>
      <nav class="ger-nav" aria-label="Painel gerente">
        <a href="../gerente/index.html">Início</a>
        <a href="../vendas-melhorada/index.html">Vendas</a>
        <a href="../clientes-page/index.html">Clientes</a>
        <a href="#" class="active">Fornecedores</a>
        <a href="../estoque-page/index.html">Estoque</a>
      </nav>
      <div class="ger-user">
        <span class="ger-user-text">
          <span style="font-weight:600;color:var(--fg-1);">M. Wei</span>
          <span style="font-size:11px;color:var(--fg-3);">Gerente</span>
        </span>
        <span class="ger-avatar">MW</span>
      </div>
    </header>
    <div id="root"></div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="mock-data.jsx"></script>
  <script type="text/babel" src="FornecedoresList.jsx"></script>
  <script type="text/babel" src="FornecedorEditarModal.jsx"></script>

  <script type="text/babel">
    function App() {
      const [forns, setForns] = React.useState(window.MOCK_FORNECEDORES);
      const [emEdicao, setEmEdicao] = React.useState(null);
      const [modalAberto, setModal] = React.useState(false);
      const [selecionados, setSel] = React.useState(new Set());
      const [toast, setToast] = React.useState(null);

      function abrirNovo() { setEmEdicao(null); setModal(true); }
      function abrirEditar(f) { setEmEdicao(f); setModal(true); }
      function salvar(d) {
        if (emEdicao) {
          setForns((cur) => cur.map((f) => f.id === emEdicao.id ? { ...f, ...d } : f));
          flash('ok', `Fornecedor "${d.nome}" atualizado.`);
        } else {
          setForns((cur) => [{ id: window.uuid(), ativo: true, criado_em: new Date().toISOString(), ...d }, ...cur]);
          flash('ok', `Fornecedor "${d.nome}" criado.`);
        }
        setModal(false);
      }
      function excluir(f) {
        if (!confirm(`Excluir o fornecedor "${f.nome}"?`)) return;
        setForns((cur) => cur.filter((x) => x.id !== f.id));
        flash('ok', `Fornecedor excluído.`);
      }
      function bulkAtivar(novoStatus) {
        const ids = [...selecionados];
        setForns((cur) => cur.map((f) => ids.includes(f.id) ? { ...f, ativo: novoStatus } : f));
        flash('ok', `${ids.length} ${ids.length === 1 ? 'fornecedor' : 'fornecedores'} ${novoStatus ? 'ativados' : 'inativados'}.`);
        setSel(new Set());
      }
      function bulkExcluir() {
        const ids = [...selecionados];
        if (!confirm(`Excluir ${ids.length} ${ids.length === 1 ? 'fornecedor' : 'fornecedores'}? Esta ação não pode ser desfeita.`)) return;
        setForns((cur) => cur.filter((f) => !ids.includes(f.id)));
        flash('ok', `${ids.length} ${ids.length === 1 ? 'fornecedor excluído' : 'fornecedores excluídos'}.`);
        setSel(new Set());
      }
      function flash(kind, msg) { setToast({ kind, msg }); setTimeout(() => setToast(null), 2400); }

      return (
        <main className="ger-page" data-screen-label="fornecedores">
          <a href="#" className="gerente-nav-back" style={{display:'inline-block', marginBottom: 16, fontSize: 13, fontWeight: 500}}>← Início</a>

          <div className="ger-header">
            <div>
              <h1 className="ger-page-title">Fornecedores <span className="clientes-han">供应商</span></h1>
              <p className="ger-page-sub">
                <b style={{color:'var(--fg-2)'}}>{forns.length}</b> cadastrados ·{' '}
                <b style={{color:'#6ee7b7'}}>{forns.filter(f => f.ativo).length} ativos</b>
              </p>
            </div>
            <div className="ger-header-aux">
              <button className="app-btn app-btn-neutral">↓ Exportar CSV</button>
              <button className="app-btn app-btn-accent" onClick={abrirNovo}>
                <span style={{fontSize:16, lineHeight:1, marginRight:4}}>+</span> Novo fornecedor
              </button>
            </div>
          </div>

          <window.FornecedoresList
            fornecedores={forns}
            selecionados={selecionados}
            onSelecionar={setSel}
            onEditar={abrirEditar}
            onExcluir={excluir}
            onBulkAtivar={bulkAtivar}
            onBulkExcluir={bulkExcluir}
          />

          {modalAberto && (
            <window.FornecedorEditarModal
              fornecedor={emEdicao}
              onClose={() => setModal(false)}
              onSalvar={salvar}
            />
          )}

          {toast && (
            <div className={'clientes-toast ' + toast.kind}>
              <span className="clientes-toast-icon">{toast.kind === 'ok' ? '✓' : '!'}</span>
              <span>{toast.msg}</span>
            </div>
          )}
        </main>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
