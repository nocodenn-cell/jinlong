<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Jīn Lóng · Painel Gerente</title>
<link rel="icon" href="../../assets/favicon-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../components.css">
<link rel="stylesheet" href="gerente-extras.css">
</head>
<body>
  <div class="bg-oriental-clouds ger-shell">
    <div id="root"></div>
  </div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="GerenteTopBar.jsx"></script>
  <script type="text/babel" src="KPICard.jsx"></script>
  <script type="text/babel" src="Sparkline.jsx"></script>
  <script type="text/babel" src="StockCriticalPanel.jsx"></script>
  <script type="text/babel" src="ActivityFeed.jsx"></script>
  <script type="text/babel">
    const fmtBRL = (n) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(n);
    const fmtNum = (n) => new Intl.NumberFormat('pt-BR').format(n);

    // 24h faturamento series (mock — strong afternoon peak)
    const HOURS = [
      0, 0, 0, 0, 0, 0, 0, 80, 240, 420, 580, 720,
      910, 1140, 1480, 1620, 1340, 1180, 920, 640, 420, 240, 120, 60
    ].map((y, x) => ({ x, y }));
    const pico = Math.max(...HOURS.map(p => p.y));

    const STOCK = [
      { sku: 'JL-0017', name: 'Pulseira de jade — fio duplo',  han: '玉手镯',   atual: 3,  min: 12, deficit: 9 },
      { sku: 'JL-0203', name: 'Lanterna de papel vermelha',    han: '红纸灯笼', atual: 8,  min: 20, deficit: 12 },
      { sku: 'JL-0501', name: 'Bule de porcelana — dragão',    han: '龙纹瓷壶', atual: 4,  min: 10, deficit: 6 },
      { sku: 'JL-0091', name: 'Sino de vento de bronze',       han: '黄铜风铃', atual: 2,  min: 8,  deficit: 6 },
    ];

    const ACTIVITY = [
      { tipo: 'VENDA',   linha: <>Venda #1208 finalizada · <b>R$ 142,30</b> · PIX</>,             quando: 'há 6 min' },
      { tipo: 'CAIXA',   linha: <>Sangria de <b>R$ 200,00</b> aprovada por M. Wei · caixa 01</>, quando: 'há 24 min' },
      { tipo: 'ESTOQUE', linha: <>Importação NF-e #220 · <b>48 itens</b> adicionados</>,          quando: 'há 1 h 12 min' },
      { tipo: 'VENDA',   linha: <>Venda #1207 finalizada · <b>R$ 58,90</b> · Dinheiro</>,        quando: 'há 1 h 38 min' },
      { tipo: 'CAIXA',   linha: <>Caixa 02 aberto por J. Wei · saldo inicial R$ 150,00</>,        quando: 'há 3 h' },
    ];

    function App() {
      return (
        <>
          <GerenteTopBar active="inicio" user="M. Wei" role="Gerente" />
          <main className="ger-page">
            <div className="ger-header">
              <div>
                <h1 className="ger-page-title">Olá, M. Wei</h1>
                <p className="ger-page-sub">Resumo de <b style={{color: 'var(--fg-2)'}}>quinta-feira, 14 de maio</b> · loja Jīn Lóng — Paulista.</p>
              </div>
              <div className="ger-header-aux">
                <button className="app-chip app-chip-active">Hoje</button>
                <button className="app-chip">7 dias</button>
                <button className="app-chip">30 dias</button>
              </div>
            </div>

            <div className="ger-grid-4">
              <KPICard label="Faturamento hoje"  value={fmtBRL(12430.75)}     icon={window.KPIIcon.money}  trend={+12.4} />
              <KPICard label="Ticket médio hoje" value={fmtBRL(86.32)}        icon={window.KPIIcon.ticket} trend={+3.1}  />
              <KPICard label="Vendas hoje"        value={fmtNum(144)}          icon={window.KPIIcon.cart}   trend={+8.9}  />
              <KPICard label="Margem hoje"        value={fmtBRL(4880.40)}      icon={window.KPIIcon.margin} trend={-1.2}  />
            </div>
            <p className="ger-section-meta">vs. dia anterior</p>

            <section style={{marginTop: 28}}>
              <p className="ger-eyebrow">Resumo da semana</p>
              <div className="ger-grid-3">
                <KPICard label="Faturamento semana"  value={fmtBRL(64820.00)} icon={window.KPIIcon.money}  trend={+18.6} />
                <KPICard label="Vendas semana"        value={fmtNum(782)}      icon={window.KPIIcon.cart}   trend={+11.2} />
                <KPICard label="Ticket médio semana"  value={fmtBRL(82.89)}    icon={window.KPIIcon.ticket} trend={+6.7}  />
              </div>
              <p className="ger-section-meta">vs. semana anterior</p>
            </section>

            <section className="panel" style={{marginTop: 28}}>
              <div className="sparkline-wrap">
                <div>
                  <h2 className="panel-title">Faturamento por hora — hoje</h2>
                  <p className="panel-sub">Curva intra-dia, 24 horas.</p>
                </div>
                <div style={{textAlign: 'right'}}>
                  <div className="sparkline-pico">Pico hoje</div>
                  <div className="sparkline-pico-val">{fmtBRL(pico)}</div>
                </div>
              </div>
              <Sparkline points={HOURS} ariaLabel="Faturamento por hora durante o dia atual" />
              <div className="sparkline-axis"><span>00 h</span><span>06 h</span><span>12 h</span><span>18 h</span><span>24 h</span></div>
            </section>

            <div className="ger-grid-2" style={{marginTop: 24}}>
              <StockCriticalPanel items={STOCK} />
              <ActivityFeed items={ACTIVITY} />
            </div>
          </main>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
