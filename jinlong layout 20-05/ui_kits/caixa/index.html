<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Jīn Lóng · Caixa</title>
<link rel="icon" href="../../assets/favicon-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../components.css">
<link rel="stylesheet" href="caixa-extras.css">
</head>
<body>
  <div class="caixa-oriental-root">
    <div id="root" class="caixa-app"></div>
  </div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="CaixaHeader.jsx"></script>
  <script type="text/babel" src="SearchBar.jsx"></script>
  <script type="text/babel" src="CartList.jsx"></script>
  <script type="text/babel" src="PaymentColumn.jsx"></script>
  <script type="text/babel">
    const CATALOG = [
      { id: 'jl-0142', nome: 'Taça de chá pintada à mão', han: '手绘茶杯',  unit: 38.00, codes: ['1', '0142', '7891234500142'] },
      { id: 'jl-0203', nome: 'Lanterna de papel vermelha', han: '红纸灯笼', unit: 24.50, codes: ['2', '0203', '7891234500203'] },
      { id: 'jl-0017', nome: 'Pulseira de jade — fio duplo', han: '玉手镯', unit: 142.00, codes: ['3', '0017', '7891234500017'] },
      { id: 'jl-0288', nome: 'Incenso de sândalo (caixa 30 un.)', han: '檀香', unit: 18.90, codes: ['4', '0288', '7891234500288'] },
      { id: 'jl-0501', nome: 'Bule de porcelana — dragão', han: '龙纹瓷壶', unit: 89.00, codes: ['5', '0501', '7891234500501'] },
    ];

    function App() {
      const [items, setItems] = React.useState([
        { id: 'jl-0142', nome: 'Taça de chá pintada à mão', han: '手绘茶杯',  unit: 38.00, qty: 2 },
        { id: 'jl-0501', nome: 'Bule de porcelana — dragão', han: '龙纹瓷壶', unit: 89.00, qty: 1 },
      ]);
      const [search, setSearch] = React.useState('');
      const [method, setMethod] = React.useState('PIX');
      const [toast, setToast] = React.useState(null);
      const caixaAberto = true;
      const total = items.reduce((s, i) => s + i.qty * i.unit, 0);

      function addByCode(code) {
        const norm = code.trim().toLowerCase();
        if (!norm) return;
        const found = CATALOG.find((p) =>
          p.codes.some((c) => c === norm) ||
          p.nome.toLowerCase().includes(norm) ||
          p.han.includes(norm)
        );
        if (!found) {
          setToast({ type: 'err', msg: 'Produto não encontrado.' });
          setTimeout(() => setToast(null), 2200);
          return;
        }
        setItems((cur) => {
          const existing = cur.find((i) => i.id === found.id);
          if (existing) return cur.map((i) => i.id === found.id ? { ...i, qty: i.qty + 1 } : i);
          return [...cur, { ...found, qty: 1 }];
        });
        setSearch('');
      }
      function setQty(id, qty) { setItems((cur) => cur.map((i) => i.id === id ? { ...i, qty } : i)); }
      function remove(id)      { setItems((cur) => cur.filter((i) => i.id !== id)); }
      function finalize() {
        setToast({ type: 'ok', msg: `Venda finalizada · ${window.fmtBRL(total)} · ${method}` });
        setTimeout(() => { setToast(null); setItems([]); }, 1800);
      }

      return (
        <>
          <section className="caixa-cart-pane">
            <CaixaHeader caixaId="01" operadorNome="João Wei" caixaAberto={caixaAberto} />
            <SearchBar value={search} onChange={setSearch} onSubmit={addByCode} autoFocus disabled={!caixaAberto} />
            <div className="caixa-cart-scroll">
              <CartList items={items} onQty={setQty} onRemove={remove} />
            </div>
          </section>

          <section className="caixa-pay-pane">
            <PaymentColumn
              items={items} total={total}
              caixaAberto={caixaAberto}
              method={method} onMethod={setMethod}
              onFinalize={finalize}
            />
          </section>

          {toast && (
            <div style={{
              position: 'fixed', top: 24, right: 24, zIndex: 50,
              padding: '12px 16px', borderRadius: 10,
              maxWidth: 380,
              fontSize: 13, lineHeight: 1.5,
              border: '1px solid',
              ...(toast.type === 'ok' ? {
                background: 'color-mix(in srgb, #064e3b 35%, transparent)',
                borderColor: 'color-mix(in srgb, #10b981 45%, rgba(148,163,184,0.38))',
                color: '#a7f3d0',
              } : {
                background: 'color-mix(in srgb, #7f1d1d 20%, transparent)',
                borderColor: 'color-mix(in srgb, #ef4444 45%, rgba(148,163,184,0.38))',
                color: '#fecaca',
              })
            }}>
              {toast.msg}
            </div>
          )}
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
