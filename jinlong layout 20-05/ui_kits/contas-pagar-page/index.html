<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contas a pagar — Jīn Lóng</title>
<link rel="icon" href="../../assets/favicon-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../components.css">
<link rel="stylesheet" href="../gerente/gerente-extras.css">
<link rel="stylesheet" href="../vendas-melhorada/vendas-melhorada.css">
<link rel="stylesheet" href="../clientes-page/clientes.css">
<link rel="stylesheet" href="contas-pagar.css">
</head>
<body>
  <div class="bg-oriental-clouds" style="min-height:100vh;">
    <header class="ger-topbar">
      <div class="ger-brand">
        <img src="../../assets/brand-double-dragon.png" alt="" />
        <div class="ger-brand-text">
          <div class="ger-brand-han">金龍</div>
          <div class="ger-brand-main">Jīn Lóng</div>
        </div>
      </div>
      <nav class="ger-nav" aria-label="Painel gerente">
        <a href="../gerente/index.html">Início</a>
        <a href="../vendas-melhorada/index.html">Vendas</a>
        <a href="../clientes-page/index.html">Clientes</a>
        <a href="../fornecedores-page/index.html">Fornecedores</a>
        <a href="#" class="active">Financeiro</a>
      </nav>
      <div class="ger-user">
        <span class="ger-user-text">
          <span style="font-weight:600;color:var(--fg-1);">M. Wei</span>
          <span style="font-size:11px;color:var(--fg-3);">Gerente</span>
        </span>
        <span class="ger-avatar">MW</span>
      </div>
    </header>
    <div id="root"></div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="mock-data.jsx"></script>
  <script type="text/babel" src="ContasList.jsx"></script>
  <script type="text/babel" src="PagamentoModal.jsx"></script>

  <script type="text/babel">
    function App() {
      const [contas, setContas] = React.useState(window.MOCK_CONTAS);
      const [emPagamento, setEmPagamento] = React.useState(null);
      const [toast, setToast] = React.useState(null);

      function registrarPagamento(payload) {
        setContas((cur) => cur.map((c) => {
          if (c.id !== payload.conta_id) return c;
          const novoPago = c.valor_pago + payload.valor;
          const novoStatus = novoPago >= c.valor_total - 0.001 ? 'PAGO' : 'PARCIAL';
          return {
            ...c,
            valor_pago: novoPago,
            status: novoStatus,
            pagamentos: [
              ...(c.pagamentos || []),
              { id: window.uuid(), ...payload, data: payload.data || new Date().toISOString() }
            ],
          };
        }));
        flash('ok', `Pagamento de ${window.fmtBRL(payload.valor)} registrado.`);
        setEmPagamento(null);
      }
      function cancelar(c) {
        if (!confirm(`Cancelar a conta "${c.descricao}"? Não pode ser desfeito.`)) return;
        setContas((cur) => cur.map((x) => x.id === c.id ? { ...x, status: 'CANCELADO' } : x));
        flash('ok', 'Conta cancelada.');
      }
      function flash(kind, msg) { setToast({ kind, msg }); setTimeout(() => setToast(null), 2400); }

      return (
        <main className="ger-page" data-screen-label="contas-pagar">
          <a href="#" className="gerente-nav-back" style={{display:'inline-block', marginBottom: 16, fontSize: 13, fontWeight: 500}}>← Financeiro</a>

          <div className="ger-header">
            <div>
              <h1 className="ger-page-title">Contas a pagar <span className="clientes-han">应付账款</span></h1>
              <p className="ger-page-sub">Gestão de obrigações com fornecedores · parcelas geradas pela importação de NF-e aparecem aqui automaticamente.</p>
            </div>
            <div className="ger-header-aux">
              <button className="app-btn app-btn-neutral" onClick={() => window.exportarCsv(contas)}>↓ Exportar CSV</button>
              <button className="app-btn app-btn-accent">+ Lançar conta</button>
            </div>
          </div>

          <window.ContasList
            contas={contas}
            onRegistrarPagamento={(c) => setEmPagamento(c)}
            onCancelar={cancelar}
          />

          {emPagamento && (
            <window.PagamentoModal
              conta={emPagamento}
              onClose={() => setEmPagamento(null)}
              onConfirmar={registrarPagamento}
            />
          )}

          {toast && (
            <div className={'clientes-toast ' + toast.kind}>
              <span className="clientes-toast-icon">{toast.kind === 'ok' ? '✓' : '!'}</span>
              <span>{toast.msg}</span>
            </div>
          )}
        </main>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
