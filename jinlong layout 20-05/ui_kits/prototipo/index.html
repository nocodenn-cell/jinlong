<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Jīn Lóng · Protótipo PDV</title>
<link rel="icon" href="../../assets/favicon-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../components.css">
<link rel="stylesheet" href="../caixa/caixa-extras.css">
<link rel="stylesheet" href="prototipo.css">
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="Shell.jsx"></script>
  <script type="text/babel" src="modals.jsx"></script>
  <script type="text/babel" src="caixa-screens.jsx"></script>
  <script type="text/babel" src="caixa-screens-2.jsx"></script>
  <script type="text/babel" src="gerente-screens-1.jsx"></script>
  <script type="text/babel" src="gerente-screens-2.jsx"></script>
  <script type="text/babel" src="gerente-screens-3.jsx"></script>

  <script type="text/babel">
    function App() {
      const [route, setRoute] = React.useState('inicio');
      const [modal, setModal]   = React.useState(null);
      const [drawer, setDrawer] = React.useState(null);

      // Determine surface from current route
      const allItems = window.NAV_GROUPS.flatMap(g => g.items);
      const current  = allItems.find((i) => i.id === route) || allItems[0];
      const surface  = current.surface;

      const labelMap = {
        caixa:       ['Operar caixa',          '收银台'],
        abertura:    ['Abertura de caixa',     '开班'],
        fechamento:  ['Fechamento de caixa',   '结班'],
        devolucao:   ['Devolução / Troca',     '退货'],
        pagamento:   ['Pagamento',             '付款'],
        recibo:      ['Recibo / Cupom',        '票据'],
        inicio:      ['Início — dashboard',    '主页'],
        historico:   ['Histórico de vendas',   '销售历史'],
        produtos:    ['Produtos',              '商品'],
        estoque:     ['Estoque',               '库存'],
        clientes:    ['Clientes',              '客户'],
        fornecedores:['Fornecedores',          '供应商'],
        nfe:         ['Importação NF-e',       '电子发票'],
        financeiro:  ['Relatórios — financeiro','财务'],
        fiscal:      ['Relatórios — fiscal',    '税务'],
        usuarios:    ['Usuários e permissões', '权限'],
        config:      ['Configurações',         '设置'],
      };
      const [label, han] = labelMap[route] || [current.label, ''];

      // Render the active screen
      const screen = (() => {
        const go = (id) => setRoute(id);
        const openModal = (id) => setModal(id);
        switch (route) {
          case 'caixa':       return <window.ScreenCaixa go={go} openModal={openModal} />;
          case 'abertura':    return <window.ScreenAbertura go={go} />;
          case 'fechamento':  return <window.ScreenFechamento go={go} openModal={openModal} />;
          case 'devolucao':   return <window.ScreenDevolucao openModal={openModal} />;
          case 'pagamento':   return <window.ScreenPagamento openModal={openModal} />;
          case 'recibo':      return <window.ScreenRecibo />;
          case 'inicio':      return <window.ScreenInicio go={go} />;
          case 'historico':   return <window.ScreenHistorico openDrawer={(v) => setDrawer(v)} />;
          case 'produtos':    return <window.ScreenProdutos />;
          case 'estoque':     return <window.ScreenEstoque />;
          case 'clientes':    return <window.ScreenClientes />;
          case 'fornecedores':return <window.ScreenFornecedores />;
          case 'nfe':         return <window.ScreenNfe />;
          case 'financeiro':  return <window.ScreenFinanceiro />;
          case 'fiscal':      return <window.ScreenFiscal />;
          case 'usuarios':    return <window.ScreenUsuarios />;
          case 'config':      return <window.ScreenConfig />;
          default:            return <window.ScreenInicio go={go} />;
        }
      })();

      const extras = surface === 'caixa' ? (
        <>
          <span className="proto-pill ok">caixa 01 · aberto</span>
          <button className="app-chip" onClick={() => setModal('sangria')}>F5 · Sangria</button>
        </>
      ) : (
        <span className="proto-pill muted">M. Wei · Gerente</span>
      );

      return (
        <div className="proto-shell">
          <window.Sidebar activeId={route} onSelect={setRoute} />
          <main className={'proto-content surface-' + surface} data-screen-label={'screen-' + route}>
            <window.TopContextBar surface={surface} screenLabel={label} screenHan={han} extras={extras} />
            {screen}
          </main>

          {modal === 'sangria'    && <window.SangriaModal onClose={() => setModal(null)} openModal={(id) => setModal(id)} />}
          {modal === 'aprovacao'  && <window.AprovacaoGerenteModal onClose={() => setModal(null)} />}
          {drawer && <window.VendaDrawer venda={drawer} onClose={() => setDrawer(null)} openModal={(id) => setModal(id)} go={setRoute} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
