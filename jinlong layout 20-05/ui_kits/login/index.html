<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Jīn Lóng · Entrar</title>
<link rel="icon" href="../../assets/favicon-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../components.css">
<style>
  /* —— Bespoke login styles, matching `theme-oriental.css` login-premium-* —— */
  html, body { background: #000; }
  body { min-height: 100vh; margin: 0; color: #fafafa; }
  .login-premium-root {
    position: relative;
    isolation: isolate;
    background: #000;
    color: #fafafa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }
  .login-stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    width: 100%;
    max-width: 380px;
  }
  .login-premium-art-wrap {
    animation: dragon-fade-rise 1s ease-out both;
    margin-bottom: 8px;
  }
  .login-premium-dragon-frame {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 280px;
    height: 280px;
  }
  .login-premium-dragon-media { overflow: hidden; border-radius: 4px; }
  .login-premium-dragon-img {
    image-rendering: auto;
    width: 280px;
    height: 280px;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 0 32px rgba(212, 175, 55, 0.40));
  }
  .login-premium-vignette {
    pointer-events: none;
    position: absolute;
    inset: -5%;
    z-index: 2;
    background: radial-gradient(ellipse 88% 78% at 50% 34%,
      transparent 0%, transparent 38%,
      rgba(0,0,0,0.28) 62%, rgba(0,0,0,0.75) 84%, #000 100%);
  }
  .login-premium-wordmark {
    color: #bfa76a;
    text-shadow: 0 1px 18px rgba(0,0,0,0.85);
    text-align: center;
    margin: 24px 0 40px;
    display: flex;
    align-items: center;
    gap: 14px;
    line-height: 1;
  }
  .login-premium-divider { color: rgba(191,167,106,0.45); font-weight: 400; font-family: var(--font-serif-display); font-size: 30px; letter-spacing: 0; }
  .login-premium-wordmark-han {
    font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    font-weight: 700;
    font-size: 38px;
    letter-spacing: 0.10em;
    color: #d4af37;
  }
  .login-premium-wordmark-roman {
    font-family: var(--font-serif-display);
    font-size: 16px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(191,167,106,0.85);
  }
  .login-premium-form-block {
    animation: dragon-fade-rise 0.85s ease-out 0.42s both;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .login-premium-field { display: flex; flex-direction: column; gap: 8px; }
  .login-premium-label {
    font-family: var(--font-sans);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(212,175,55,0.52);
  }
  .login-premium-input {
    width: 100%;
    border-radius: 0;
    border: none;
    border-bottom: 1px solid rgba(212,175,55,0.35);
    background: rgba(13,13,13,0.85);
    padding: 10px 4px 8px;
    font-size: 14px;
    color: #f5f5f5;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    font-family: var(--font-sans);
    box-sizing: border-box;
  }
  .login-premium-input::placeholder { color: rgba(250,250,250,0.38); }
  .login-premium-input:focus {
    border-bottom-color: rgba(212,175,55,0.95);
    box-shadow: 0 1px 0 0 rgba(212,175,55,0.65);
    background: rgba(13,13,13,0.95);
  }
  .login-premium-submit {
    margin-top: 4px;
    width: 100%;
    border-radius: 6px;
    border: none;
    background: #d4af37;
    color: #000;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.06em;
    font-family: var(--font-sans);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: filter 0.2s, box-shadow 0.2s;
  }
  .login-premium-submit:hover:not(:disabled) { filter: brightness(1.06); }
  .login-premium-submit:active:not(:disabled) {
    box-shadow: 0 6px 22px -6px rgba(212,175,55,0.55);
  }
  .login-premium-submit:disabled { opacity: 0.65; cursor: not-allowed; }
  .login-premium-error {
    text-align: center;
    font-size: 13px;
    color: #fca5a5;
    margin: 0;
  }
  .login-premium-inactivity {
    border: 1px solid rgba(212,175,55,0.35);
    background: rgba(0,0,0,0.55);
    color: rgba(253,230,138,0.95);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    text-align: center;
    margin-bottom: 18px;
  }
  .ok-banner {
    margin-top: 24px;
    text-align: center;
    font-family: var(--font-serif-han);
    color: #a7f3d0;
    font-size: 14px;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body class="login-premium-root">
  <div class="login-stack">
    <div id="root"></div>
  </div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="DragonHero.jsx"></script>
  <script type="text/babel" src="Wordmark.jsx"></script>
  <script type="text/babel" src="LoginForm.jsx"></script>
  <script type="text/babel">
    function LoginPage() {
      const [signedIn, setSignedIn] = React.useState(false);
      const showInactivity = new URLSearchParams(location.search).get('reason') === 'sessao_inatividade';
      return (
        <>
          <div className="login-premium-art-wrap"><DragonHero /></div>
          <Wordmark />
          {showInactivity && (
            <p className="login-premium-inactivity" role="status">
              Sua sessão expirou por inatividade. Faça login novamente.
            </p>
          )}
          <LoginForm onSubmit={() => setSignedIn(true)} />
          {signedIn && <div className="ok-banner">✓ Autenticado · redirecionando ao painel…</div>}
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<LoginPage />);
  </script>
</body>
</html>
