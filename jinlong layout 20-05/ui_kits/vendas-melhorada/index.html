<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendas (gerente) — lista + detalhe em modal</title>
<link rel="icon" href="../../assets/favicon-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../components.css">
<link rel="stylesheet" href="../gerente/gerente-extras.css">
<link rel="stylesheet" href="vendas-melhorada.css">
</head>
<body>
  <div class="bg-oriental-clouds" style="min-height:100vh;">
    <header class="ger-topbar">
      <div class="ger-brand">
        <img src="../../assets/brand-double-dragon.png" alt="" />
        <div class="ger-brand-text">
          <div class="ger-brand-han">金龍</div>
          <div class="ger-brand-main">Jīn Lóng</div>
        </div>
      </div>
      <nav class="ger-nav" aria-label="Painel gerente">
        <a href="../gerente/index.html">Início</a>
        <a href="#" class="active">Vendas</a>
        <a href="#">Caixas</a>
        <a href="#">Estoque</a>
        <a href="#">Financeiro</a>
        <a href="#">Relatórios</a>
        <a href="#">Produtos</a>
      </nav>
      <div class="ger-user">
        <span class="ger-user-text">
          <span style="font-weight: 600; color: var(--fg-1);">M. Wei</span>
          <span style="font-size: 11px; color: var(--fg-3);">Gerente</span>
        </span>
        <span class="ger-avatar">MW</span>
      </div>
    </header>

    <div id="root"></div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="mock-data.jsx"></script>
  <script type="text/babel" src="VendasList.jsx"></script>
  <script type="text/babel" src="VendaDetalheModal.jsx"></script>

  <script type="text/babel">
    function App() {
      const [selecionada, setSelecionada] = React.useState(null);
      const [vendas, setVendas] = React.useState(window.MOCK_VENDAS);

      function cancelar(vendaId, motivo) {
        setVendas((cur) => cur.map((v) => v.id === vendaId
          ? { ...v, status: 'CANCELADA', cancelamento_motivo: motivo, cancelamento_em: new Date().toISOString() }
          : v));
        setSelecionada((s) => s && s.id === vendaId
          ? { ...s, status: 'CANCELADA', cancelamento_motivo: motivo }
          : s);
      }

      return (
        <main className="ger-page" data-screen-label="vendas-gerente">
          <a href="#" className="gerente-nav-back" style={{display:'inline-block', marginBottom: 16, fontSize: 13, fontWeight: 500}}>
            ← Início
          </a>

          <div className="ger-header">
            <div>
              <h1 className="ger-page-title">Vendas</h1>
              <p className="ger-page-sub">Histórico completo · clique em uma linha para ver o detalhe.</p>
            </div>
            <div className="ger-header-aux">
              <button className="app-chip app-chip-active">Todas</button>
              <button className="app-chip">Hoje</button>
              <button className="app-chip">7 dias</button>
              <button className="app-chip">↓ Exportar CSV</button>
            </div>
          </div>

          <window.VendasList vendas={vendas} onRowClick={setSelecionada} />

          {selecionada && (
            <window.VendaDetalheModal
              venda={selecionada}
              onClose={() => setSelecionada(null)}
              onCancelar={cancelar}
            />
          )}
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
