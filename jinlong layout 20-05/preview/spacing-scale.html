<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{display:flex;justify-content:center}
  .card{width:700px;box-sizing:border-box;padding:28px 32px;background:var(--bg-page);color:var(--fg-1);border-radius:16px;overflow:hidden;position:relative}
  .row{display:grid;grid-template-columns:60px 80px 1fr;align-items:center;padding:6px 0;gap:14px}
  .name{font-family:var(--font-numeric);font-size:11px;font-weight:600;color:var(--fg-2);letter-spacing:0.04em}
  .px{font-family:var(--font-numeric);font-size:10px;color:var(--fg-3)}
  .bar{height:14px;background:linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, transparent));border-radius:2px}
  .heading{font-size:15px;font-weight:600;margin-bottom:4px}
  .role{font-size:12px;color:var(--fg-3);margin-bottom:10px}
</style>
</head>
<body>
<div class="card">
  <div class="heading">Spacing scale</div>
  <div class="role">4 px base. Token names match the production CSS (--space-N).</div>
  <div class="row"><div class="name">space-1</div><div class="px">4 px</div><div class="bar" style="width:4px"></div></div>
  <div class="row"><div class="name">space-2</div><div class="px">8 px</div><div class="bar" style="width:8px"></div></div>
  <div class="row"><div class="name">space-3</div><div class="px">12 px</div><div class="bar" style="width:12px"></div></div>
  <div class="row"><div class="name">space-4</div><div class="px">16 px</div><div class="bar" style="width:16px"></div></div>
  <div class="row"><div class="name">space-5</div><div class="px">20 px</div><div class="bar" style="width:20px"></div></div>
  <div class="row"><div class="name">space-6</div><div class="px">24 px</div><div class="bar" style="width:24px"></div></div>
  <div class="row"><div class="name">space-8</div><div class="px">32 px</div><div class="bar" style="width:32px"></div></div>
  <div class="row"><div class="name">space-10</div><div class="px">40 px</div><div class="bar" style="width:40px"></div></div>
  <div class="row"><div class="name">space-12</div><div class="px">48 px</div><div class="bar" style="width:48px"></div></div>
  <div class="row"><div class="name">space-16</div><div class="px">64 px</div><div class="bar" style="width:64px"></div></div>
  <div class="row"><div class="name">space-20</div><div class="px">80 px</div><div class="bar" style="width:80px"></div></div>
  <div class="row"><div class="name">space-24</div><div class="px">96 px</div><div class="bar" style="width:96px"></div></div>
</div>
</body>
</html>
