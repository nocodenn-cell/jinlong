<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{display:flex;justify-content:center}
  .card{width:700px;box-sizing:border-box;padding:28px 32px;background:var(--bg-page);color:var(--fg-1);border-radius:16px;overflow:hidden;position:relative}
  .group{display:flex;flex-direction:column;gap:14px;margin-top:10px}
  .field{display:flex;flex-direction:column;gap:6px}
  .heading{font-size:15px;font-weight:600;margin-bottom:4px}
  .role{font-size:12px;color:var(--fg-3);margin-bottom:8px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .focused{border-color:var(--accent) !important;box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 38%, transparent)}
</style>
</head>
<body>
<div class="card">
  <div class="heading">Inputs & selects</div>
  <div class="role">app-input · 44 px height · amber focus ring · placeholder at 68 % opacity.</div>
  <div class="group">
    <div class="row2">
      <div class="field">
        <label class="t-label">E-mail</label>
        <input class="app-input" type="email" placeholder="operador@loja.com.br">
      </div>
      <div class="field">
        <label class="t-label">Senha · focused</label>
        <input class="app-input focused" type="password" value="••••••••">
      </div>
    </div>
    <div class="field">
      <label class="t-label">Buscar produto (código de barras ou nome)</label>
      <input class="app-input" placeholder="ex.: 7891234567890 · 茶杯 · taça de chá">
    </div>
    <div class="field">
      <label class="t-label">Disabled</label>
      <input class="app-input" disabled value="caixa fechado">
    </div>
  </div>
</div>
</body>
</html>
