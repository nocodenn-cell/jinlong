<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{display:flex;justify-content:center}
  .card{width:700px;box-sizing:border-box;padding:28px 32px;background:var(--bg-page);color:var(--fg-1);border-radius:16px;overflow:hidden;position:relative}
  .heading{font-size:15px;font-weight:600;margin-bottom:4px}
  .role{font-size:12px;color:var(--fg-3);margin-bottom:12px}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .pay{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:120px;border-radius:12px;font-weight:700;font-size:14px;border:1px solid;cursor:pointer;position:relative;transition:all 150ms cubic-bezier(0.4,0,0.2,1)}
  .pix{background:linear-gradient(180deg,#fcca48,#cc8c08);color:#111827;border-color:rgba(217,119,6,0.72);box-shadow:0 1px 3px rgb(0 0 0 / 0.3)}
  .pix.active{outline:3px solid rgba(251,191,36,0.45);outline-offset:-2px;transform:translateY(-2px);box-shadow:0 8px 24px rgba(251,191,36,0.35)}
  .card-pay{background:rgba(15,23,42,0.62);color:#f1f5f9;border-color:var(--border-1);box-shadow:0 1px 3px rgb(0 0 0 / 0.3)}
  .cash{background:rgba(15,23,42,0.42);color:var(--fg-2);border-color:var(--border-1)}
  .glyph{font-size:28px;line-height:1}
  .key{font-size:10px;opacity:0.7;font-weight:500}
</style>
</head>
<body>
<div class="card">
  <div class="heading">Payment buttons</div>
  <div class="role">Caixa: 3-up column · PIX accent (selected) · CARTÃO neutral · DINHEIRO subtle. Function-key always visible.</div>
  <div class="grid">
    <button class="pay pix active">
      <div class="glyph">⌐□</div>
      <div>PIX</div>
      <div class="key">(F8)</div>
    </button>
    <button class="pay card-pay">
      <div class="glyph">▭</div>
      <div>CARTÃO</div>
      <div class="key">(F9)</div>
    </button>
    <button class="pay cash">
      <div class="glyph">●●</div>
      <div>DINHEIRO</div>
      <div class="key">(F10)</div>
    </button>
  </div>
</div>
</body>
</html>
