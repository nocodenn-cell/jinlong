<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { display:flex; align-items:center; justify-content:center; }
  .card-frame {
    width: 700px;
    box-sizing: border-box;
    padding: 28px 32px;
    background: var(--bg-page);
    color: var(--fg-1);
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    isolation: isolate;
  }
  .card-frame::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; z-index:0;
    opacity: 0.18;
    background-image:
      radial-gradient(ellipse 88% 50% at 12% 18%, rgba(251, 191, 36, 0.16) 0%, transparent 56%),
      radial-gradient(ellipse 70% 42% at 88% 12%, rgba(148, 163, 184, 0.14) 0%, transparent 56%);
  }
  .card-frame > * { position: relative; z-index: 1; }
  .row { display:flex; align-items:center; gap: 32px; }
  .hero-mark { width: 156px; height: 156px; flex-shrink: 0; object-fit: contain; filter: drop-shadow(0 0 18px rgba(251, 191, 36, 0.25)); }
  .wordmark { display:flex; flex-direction:column; gap: 6px; }
  .wm-han  { font-family: var(--font-serif-han); font-size: 52px; font-weight: 700; letter-spacing: 0.10em; color: var(--logo-wordmark-main); line-height: 1; white-space: nowrap; }
  .wm-main { font-family: var(--font-sans); font-size: 22px; font-weight: 500; letter-spacing: 0.04em; color: var(--logo-wordmark-subtitle); line-height: 1.1; white-space: nowrap; text-transform: uppercase; }
  .wm-tag  { font-family: var(--font-sans); font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); margin-top: 12px; }
</style>
</head>
<body>
<div class="card-frame">
  <div class="row">
    <img class="hero-mark" src="../assets/brand-double-dragon.png" alt="Jīn Lóng double-dragon mark">
    <div class="wordmark">
      <div class="wm-han">金龍</div>
      <div class="wm-main">Jīn Lóng</div>
    </div>
  </div>
</div>
</body>
</html>
