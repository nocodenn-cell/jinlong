<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700;900&family=Inter:wght@400;500;600;700&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{display:flex;justify-content:center}
  .card{width:700px;box-sizing:border-box;padding:36px 40px;background:#000;color:#fafafa;border-radius:16px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;gap:40px;min-height:240px}
  .hero{
    height:180px;width:180px;object-fit:contain;flex-shrink:0;
    filter: drop-shadow(0 0 26px rgba(212, 175, 55, 0.35));
  }
  .meta{display:flex;flex-direction:column;gap:4px}
  .han{font-family:'Noto Serif SC',serif;font-size:46px;font-weight:700;letter-spacing:0.10em;color:#d4af37;line-height:1;text-shadow:0 1px 18px rgba(0,0,0,0.85)}
  .roman{font-family:var(--font-serif-display);font-size:16px;letter-spacing:0.22em;text-transform:uppercase;color:rgba(191,167,106,0.85);margin-top:6px}
  .label{font-size:10px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;color:rgba(212,175,55,0.6);margin-top:14px}
  .desc{font-size:12px;color:rgba(250,250,250,0.55);line-height:1.5;max-width:260px;margin-top:6px}
</style>
</head>
<body>
<div class="card">
  <img class="hero" src="../assets/brand-double-dragon.png" alt="Jīn Lóng double-dragon mark">
  <div class="meta">
    <div class="han">金龍</div>
    <div class="roman">Jīn Lóng</div>
    <div class="label">Login · ceremonial</div>
    <div class="desc">Double-dragon lockup over absolute-black field. Han characters lead; romanization is the subtitle. Used only on the login splash.</div>
  </div>
</div>
</body>
</html>
