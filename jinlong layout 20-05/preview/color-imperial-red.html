<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{display:flex;justify-content:center}
  .card{width:700px;box-sizing:border-box;padding:28px 32px;background:var(--bg-page);color:var(--fg-1);border-radius:16px;overflow:hidden;position:relative}
  .row{display:flex;gap:24px;align-items:center}
  .swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;flex:1}
  .sw{display:flex;flex-direction:column;align-items:stretch;gap:6px}
  .chip{height:60px;border-radius:8px;border:1px solid rgba(255,255,255,0.06)}
  .step{font-family:var(--font-numeric);font-size:11px;font-weight:600;color:var(--fg-2);text-align:center}
  .hex{font-family:var(--font-numeric);font-size:10px;color:var(--fg-3);text-align:center}
  .heading{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
  .title{font-size:15px;font-weight:600}
  .role{font-size:12px;color:var(--fg-3)}
  .star{color:#fca5a5;margin-left:4px}
  .seal{font-family:var(--font-serif-han);font-size:60px;color:#b91c1c;background:rgba(185,28,28,0.12);border:1px solid rgba(185,28,28,0.45);border-radius:10px;padding:14px 22px;transform:rotate(-7deg);line-height:1;flex-shrink:0}
</style>
</head>
<body>
<div class="card">
  <div class="heading">
    <div class="title">Imperial Red</div>
    <div class="role">Danger · destructive · authorisation seal (印)</div>
  </div>
  <div class="row">
    <div class="seal">印</div>
    <div class="swatches">
      <div class="sw"><div class="chip" style="background:#fef2f2"></div><div class="step">50</div><div class="hex">#FEF2F2</div></div>
      <div class="sw"><div class="chip" style="background:#fee2e2"></div><div class="step">100</div><div class="hex">#FEE2E2</div></div>
      <div class="sw"><div class="chip" style="background:#fecaca"></div><div class="step">200</div><div class="hex">#FECACA</div></div>
      <div class="sw"><div class="chip" style="background:#ef4444"></div><div class="step">500</div><div class="hex">#EF4444</div></div>
      <div class="sw"><div class="chip" style="background:#dc2626"></div><div class="step">600</div><div class="hex">#DC2626</div></div>
      <div class="sw"><div class="chip" style="background:#b91c1c;outline:2px solid #fca5a5;outline-offset:-3px"></div><div class="step">700 <span class="star">★</span></div><div class="hex">#B91C1C</div></div>
      <div class="sw"><div class="chip" style="background:#7f1d1d"></div><div class="step">900</div><div class="hex">#7F1D1D</div></div>
    </div>
  </div>
</div>
</body>
</html>
