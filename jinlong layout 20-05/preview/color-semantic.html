<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{display:flex;justify-content:center}
  .card{width:700px;box-sizing:border-box;padding:28px 32px;background:var(--bg-page);color:var(--fg-1);border-radius:16px;overflow:hidden;position:relative}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}
  .tile{border:1px solid var(--border-1);border-radius:10px;padding:14px;background:var(--surface-soft)}
  .label{font-size:10px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:var(--fg-3);margin-bottom:8px}
  .swatch{height:32px;border-radius:6px;margin-bottom:10px}
  .name{font-size:13px;font-weight:600;margin-bottom:2px}
  .hex{font-family:var(--font-numeric);font-size:10px;color:var(--fg-3)}
  .heading{display:flex;align-items:baseline;justify-content:space-between}
  .title{font-size:15px;font-weight:600}
  .role{font-size:12px;color:var(--fg-3)}
</style>
</head>
<body>
<div class="card">
  <div class="heading">
    <div class="title">Semantic roles</div>
    <div class="role">Success · Warning · Danger · Info</div>
  </div>
  <div class="row">
    <div class="tile"><div class="label">success</div><div class="swatch" style="background:#10b981"></div><div class="name">Jade 500</div><div class="hex">#10B981</div></div>
    <div class="tile"><div class="label">warning</div><div class="swatch" style="background:#f59e0b"></div><div class="name">Gold 500</div><div class="hex">#F59E0B</div></div>
    <div class="tile"><div class="label">danger</div><div class="swatch" style="background:#ef4444"></div><div class="name">Imperial 500</div><div class="hex">#EF4444</div></div>
    <div class="tile"><div class="label">info</div><div class="swatch" style="background:#60a5fa"></div><div class="name">Sky 400</div><div class="hex">#60A5FA</div></div>
  </div>
</div>
</body>
</html>
