<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{display:flex;justify-content:center}
  .card{width:700px;box-sizing:border-box;padding:28px 32px;background:var(--bg-page);color:var(--fg-1);border-radius:16px;overflow:hidden;position:relative}
  .swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .sw{display:flex;flex-direction:column;align-items:stretch;gap:6px}
  .chip{height:64px;border-radius:8px;border:1px solid rgba(255,255,255,0.06)}
  .step{font-family:var(--font-numeric);font-size:11px;font-weight:600;color:var(--fg-2);text-align:center}
  .hex{font-family:var(--font-numeric);font-size:10px;color:var(--fg-3);text-align:center}
  .heading{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
  .title{font-size:15px;font-weight:600}
  .role{font-size:12px;color:var(--fg-3)}
  .star{color:#10b981;margin-left:4px}
</style>
</head>
<body>
<div class="card">
  <div class="heading">
    <div class="title">Dragon Jade</div>
    <div class="role">Success · positive entries · confirmation</div>
  </div>
  <div class="swatches">
    <div class="sw"><div class="chip" style="background:#ecfdf5"></div><div class="step">50</div><div class="hex">#ECFDF5</div></div>
    <div class="sw"><div class="chip" style="background:#d1fae5"></div><div class="step">100</div><div class="hex">#D1FAE5</div></div>
    <div class="sw"><div class="chip" style="background:#a7f3d0"></div><div class="step">200</div><div class="hex">#A7F3D0</div></div>
    <div class="sw"><div class="chip" style="background:#10b981;outline:2px solid #34d399;outline-offset:-3px"></div><div class="step">500 <span class="star">★</span></div><div class="hex">#10B981</div></div>
    <div class="sw"><div class="chip" style="background:#059669"></div><div class="step">600</div><div class="hex">#059669</div></div>
    <div class="sw"><div class="chip" style="background:#047857"></div><div class="step">700</div><div class="hex">#047857</div></div>
    <div class="sw"><div class="chip" style="background:#064e3b"></div><div class="step">900</div><div class="hex">#064E3B</div></div>
  </div>
</div>
</body>
</html>
