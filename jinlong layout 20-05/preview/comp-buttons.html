<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{display:flex;justify-content:center}
  .card{width:700px;box-sizing:border-box;padding:28px 32px;background:var(--bg-page);color:var(--fg-1);border-radius:16px;overflow:hidden;position:relative}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px;align-items:center;margin-top:12px}
  .lbl{font-family:var(--font-numeric);font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-3)}
  .heading{font-size:15px;font-weight:600;margin-bottom:4px}
  .role{font-size:12px;color:var(--fg-3);margin-bottom:6px}
  /* hover-state demo via transform/shadow on a separate row */
  .accent-hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 4px 12px rgba(251,191,36,0.25) !important}
  .neutral-hover{border-color:var(--accent) !important;background:color-mix(in srgb, var(--surface) 85%, var(--accent) 15%) !important;transform:translateY(-1px);box-shadow:0 2px 8px rgba(251,191,36,0.20) !important}
  .danger-hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:0 4px 12px rgba(239,68,68,0.35) !important}
</style>
</head>
<body>
<div class="card">
  <div class="heading">Buttons</div>
  <div class="role">app-btn-accent · app-btn-neutral · app-btn-danger — rest, hover, disabled.</div>
  <div class="grid">
    <div class="lbl">rest</div>
    <div class="lbl">hover</div>
    <div class="lbl">disabled</div>
    <button class="app-btn app-btn-accent">Finalizar venda</button>
    <button class="app-btn app-btn-accent accent-hover">Finalizar venda</button>
    <button class="app-btn app-btn-accent" disabled>Finalizar venda</button>
    <button class="app-btn app-btn-neutral">Cancelar</button>
    <button class="app-btn app-btn-neutral neutral-hover">Cancelar</button>
    <button class="app-btn app-btn-neutral" disabled>Cancelar</button>
    <button class="app-btn app-btn-danger">Excluir</button>
    <button class="app-btn app-btn-danger danger-hover">Excluir</button>
    <button class="app-btn app-btn-danger" disabled>Excluir</button>
  </div>
</div>
</body>
</html>
