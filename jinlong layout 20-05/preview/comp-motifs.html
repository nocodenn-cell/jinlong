<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{display:flex;justify-content:center}
  .card{width:700px;box-sizing:border-box;padding:28px 32px;background:var(--bg-page);color:var(--fg-1);border-radius:16px;overflow:hidden;position:relative}
  .heading{font-size:15px;font-weight:600;margin-bottom:4px}
  .role{font-size:12px;color:var(--fg-3);margin-bottom:14px}
  .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;border:1px solid var(--border-1);border-radius:10px;background:rgba(15,23,42,0.42)}
  .seal{display:inline-block;font-family:var(--font-serif-han);font-size:48px;color:#b91c1c;background:rgba(185,28,28,0.12);border:1px solid rgba(185,28,28,0.45);border-radius:8px;padding:8px 14px;transform:rotate(-7deg);line-height:1}
  .loader{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;animation:orbit 1.25s linear infinite}
  .loader img{width:48px;height:48px}
  @keyframes orbit{to{transform:rotate(360deg)}}
  .breathe{animation:breathe 3.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:1;filter:drop-shadow(0 0 0 transparent)}50%{opacity:0.92;filter:drop-shadow(0 0 14px rgba(253,224,71,0.5))}}
  .breathe img{width:64px;height:64px}
  .name{font-family:var(--font-numeric);font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-2)}
  .desc{font-size:11px;color:var(--fg-3);text-align:center;line-height:1.45}
  .pulse{animation:pulse 1.8s ease-in-out infinite;display:inline-block}
  @keyframes pulse{0%,100%{opacity:1;transform:rotate(-7deg) scale(1)}50%{opacity:0.82;transform:rotate(-7deg) scale(1.06)}}
</style>
</head>
<body>
<div class="card">
  <div class="heading">Branded motifs</div>
  <div class="role">Three brand animations the product owns: hero-breathe, ouroboros-orbit, seal-pulse.</div>
  <div class="row">
    <div class="tile">
      <div class="breathe"><img src="../assets/brand-double-dragon.png" alt=""></div>
      <div class="name">Hero · breathe</div>
      <div class="desc">Login lockup · 3.2 s opacity + glow loop</div>
    </div>
    <div class="tile">
      <div class="loader"><img src="../assets/dragon-ouroboros-amber.png" alt=""></div>
      <div class="name">Ouroboros · orbit</div>
      <div class="desc">Loader · 1.25 s rotation · replaces spinner</div>
    </div>
    <div class="tile">
      <div class="pulse seal">印</div>
      <div class="name">Imperial seal · pulse</div>
      <div class="desc">Manager-approval required · 1.8 s scale</div>
    </div>
  </div>
</div>
</body>
</html>
