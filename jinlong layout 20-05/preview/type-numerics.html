<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{display:flex;justify-content:center}
  .card{width:700px;box-sizing:border-box;padding:28px 32px;background:var(--bg-page);color:var(--fg-1);border-radius:16px;overflow:hidden;position:relative}
  .row{display:flex;align-items:center;gap:24px;padding:14px 16px;border-radius:10px;background:rgba(15,23,42,0.42);border:1px solid rgba(148,163,184,0.18)}
  .row+.row{margin-top:10px}
  .label{font-family:var(--font-numeric);font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-3);min-width:140px}
  .val{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
  .total{font-size:44px;font-weight:900;color:var(--accent);line-height:1}
  .pos{font-size:18px;font-weight:600;color:#34d399}
  .neg{font-size:18px;font-weight:600;color:#fca5a5}
  .meta{font-size:11px;color:var(--fg-3)}
  .heading{font-size:15px;font-weight:600;margin-bottom:6px}
  .role{font-size:12px;color:var(--fg-3);margin-bottom:14px}
</style>
</head>
<body>
<div class="card">
  <div class="heading">Numerics</div>
  <div class="role">Inter, tabular-nums always. Money as R$ 1.234,56 (PT-BR locale).</div>
  <div class="row">
    <div class="label">Caixa total</div>
    <div class="val total">R$ 2.430,75</div>
  </div>
  <div class="row">
    <div class="label">KPI delta · positive</div>
    <div class="val pos">+12,4%</div>
    <div class="meta">faturamento hoje · vs. dia anterior</div>
  </div>
  <div class="row">
    <div class="label">KPI delta · negative</div>
    <div class="val neg">−3,1%</div>
    <div class="meta">ticket médio · vs. semana anterior</div>
  </div>
</div>
</body>
</html>
