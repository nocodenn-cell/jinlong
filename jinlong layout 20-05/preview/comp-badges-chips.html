<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{display:flex;justify-content:center}
  .card{width:700px;box-sizing:border-box;padding:28px 32px;background:var(--bg-page);color:var(--fg-1);border-radius:16px;overflow:hidden;position:relative}
  .heading{font-size:15px;font-weight:600;margin-bottom:4px}
  .role{font-size:12px;color:var(--fg-3);margin-bottom:14px}
  .col{display:flex;flex-direction:column;gap:14px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .meta{font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-3);width:100px;flex-shrink:0}
</style>
</head>
<body>
<div class="card">
  <div class="heading">Badges & chips</div>
  <div class="role">Status pills (badges) and selectable filter chips. Pill radius (full).</div>
  <div class="col">
    <div class="row">
      <div class="meta">badges</div>
      <span class="app-badge app-badge-positive">✓ Aprovado</span>
      <span class="app-badge app-badge-warn">⚠ Atenção</span>
      <span class="app-badge app-badge-danger">✕ Recusado</span>
      <span class="app-badge app-badge-neutral">Rascunho</span>
    </div>
    <div class="row">
      <div class="meta">chips · rest</div>
      <button class="app-chip">Todos</button>
      <button class="app-chip">PIX</button>
      <button class="app-chip">Cartão</button>
      <button class="app-chip">Dinheiro</button>
    </div>
    <div class="row">
      <div class="meta">chips · active</div>
      <button class="app-chip app-chip-active">Hoje</button>
      <button class="app-chip">7 dias</button>
      <button class="app-chip">30 dias</button>
      <button class="app-chip">Personalizado</button>
    </div>
  </div>
</div>
</body>
</html>
