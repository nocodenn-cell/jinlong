<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{display:flex;justify-content:center}
  .card{width:700px;box-sizing:border-box;padding:28px 32px;background:var(--bg-page);color:var(--fg-1);border-radius:16px;overflow:hidden;position:relative}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:10px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:8px}
  .shape{width:72px;height:72px;background:linear-gradient(180deg,#fcca48,#cc8c08);border:1px solid rgba(217,119,6,0.72)}
  .name{font-family:var(--font-numeric);font-size:10px;font-weight:600;color:var(--fg-2);text-align:center}
  .px{font-family:var(--font-numeric);font-size:9px;color:var(--fg-3);text-align:center}
  .heading{font-size:15px;font-weight:600;margin-bottom:4px}
  .role{font-size:12px;color:var(--fg-3)}
</style>
</head>
<body>
<div class="card">
  <div class="heading">Border radius</div>
  <div class="role">Cards · radius-lg (8). Modals + payment buttons · radius-xl (12). Chips/badges · full.</div>
  <div class="grid">
    <div class="tile"><div class="shape" style="border-radius:0"></div><div class="name">none</div><div class="px">0</div></div>
    <div class="tile"><div class="shape" style="border-radius:2px"></div><div class="name">sm</div><div class="px">2</div></div>
    <div class="tile"><div class="shape" style="border-radius:4px"></div><div class="name">base</div><div class="px">4</div></div>
    <div class="tile"><div class="shape" style="border-radius:6px"></div><div class="name">md ★</div><div class="px">6 · btn</div></div>
    <div class="tile"><div class="shape" style="border-radius:8px"></div><div class="name">lg ★</div><div class="px">8 · card</div></div>
    <div class="tile"><div class="shape" style="border-radius:12px"></div><div class="name">xl ★</div><div class="px">12 · modal</div></div>
    <div class="tile"><div class="shape" style="border-radius:9999px"></div><div class="name">full</div><div class="px">∞ · chip</div></div>
  </div>
</div>
</body>
</html>
