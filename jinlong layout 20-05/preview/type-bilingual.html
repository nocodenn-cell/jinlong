<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{display:flex;justify-content:center}
  .card{width:700px;box-sizing:border-box;padding:28px 32px;background:var(--bg-page);color:var(--fg-1);border-radius:16px;overflow:hidden;position:relative}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:10px}
  .col{border:1px solid var(--border-1);border-radius:10px;padding:18px;background:var(--surface-soft)}
  .flag{font-family:var(--font-numeric);font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-3);margin-bottom:10px}
  .title{font-size:18px;font-weight:600;line-height:1.3;margin-bottom:6px}
  .body{font-size:14px;line-height:1.55;color:var(--fg-2)}
  .body.han{letter-spacing:0.02em}
  .heading{font-size:15px;font-weight:600;margin-bottom:4px}
  .role{font-size:12px;color:var(--fg-3);margin-bottom:6px}
</style>
</head>
<body>
<div class="card">
  <div class="heading">Bilingual specimen</div>
  <div class="role">PT-BR and 简体中文 ship as parallel UI — same component, same face.</div>
  <div class="grid">
    <div class="col">
      <div class="flag">idioma · pt-BR</div>
      <div class="title">Carrinho vazio</div>
      <div class="body">Adicione produtos usando o campo de busca abaixo, ou aponte o leitor de código de barras para o item.</div>
    </div>
    <div class="col">
      <div class="flag">idioma · zh-CN</div>
      <div class="title han" style="letter-spacing:0.02em">购物车为空</div>
      <div class="body han">请使用下方的搜索框添加商品，或将条码扫描器对准该商品。</div>
    </div>
  </div>
</div>
</body>
</html>
