<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../components.css">
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{display:flex;justify-content:center}
  .card{width:700px;box-sizing:border-box;padding:28px 32px;background:var(--bg-page);color:var(--fg-1);border-radius:16px;overflow:hidden;position:relative}
  .heading{font-size:15px;font-weight:600;margin-bottom:4px}
  .role{font-size:12px;color:var(--fg-3);margin-bottom:14px}
  .tbl{width:100%;border-collapse:collapse;background:rgba(15,23,42,0.42);border-radius:8px;overflow:hidden;border:1px solid var(--border-1)}
  th{background:rgba(15,23,42,0.78);color:var(--fg-2);text-transform:uppercase;letter-spacing:0.08em;font-size:10px;font-weight:600;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border-1)}
  td{padding:11px 14px;font-size:13px;border-bottom:1px solid rgba(148,163,184,0.18)}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:color-mix(in srgb, rgba(15,23,42,0.68) 84%, transparent)}
  td.num{font-family:var(--font-numeric);font-variant-numeric:tabular-nums;text-align:right}
  td.zh{letter-spacing:0.02em}
  .pos{color:#34d399;font-weight:600}
  .neg{color:#fca5a5;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="heading">Table — gerente list</div>
  <div class="role">Compact data table. Numeric cells right-aligned, tabular-nums, jade/red for deltas.</div>
  <table class="tbl">
    <thead><tr>
      <th>SKU</th><th>Produto</th><th>产品</th><th style="text-align:right">Estoque</th><th style="text-align:right">Δ 7 d</th>
    </tr></thead>
    <tbody>
      <tr><td>JL-0142</td><td>Taça de chá pintada</td><td class="zh">手绘茶杯</td><td class="num">24</td><td class="num pos">+8</td></tr>
      <tr><td>JL-0203</td><td>Lanterna de papel</td><td class="zh">纸灯笼</td><td class="num">12</td><td class="num neg">−6</td></tr>
      <tr><td>JL-0017</td><td>Pulseira de jade</td><td class="zh">玉手镯</td><td class="num">3</td><td class="num neg">−2</td></tr>
      <tr><td>JL-0288</td><td>Incenso de sândalo</td><td class="zh">檀香</td><td class="num">128</td><td class="num pos">+44</td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
