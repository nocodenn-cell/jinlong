<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{display:flex;justify-content:center}
  .card{width:700px;box-sizing:border-box;padding:28px 32px;background:var(--bg-page);color:var(--fg-1);border-radius:16px;overflow:hidden;position:relative}
  .swatches{display:grid;grid-template-columns:repeat(11,1fr);gap:6px}
  .sw{display:flex;flex-direction:column;align-items:stretch;gap:6px}
  .chip{height:60px;border-radius:8px;border:1px solid rgba(255,255,255,0.06)}
  .step{font-family:var(--font-numeric);font-size:10px;font-weight:600;color:var(--fg-2);text-align:center}
  .hex{font-family:var(--font-numeric);font-size:9px;color:var(--fg-3);text-align:center}
  .heading{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
  .title{font-size:15px;font-weight:600}
  .role{font-size:12px;color:var(--fg-3)}
</style>
</head>
<body>
<div class="card">
  <div class="heading">
    <div class="title">Night · slate neutrals</div>
    <div class="role">Surface · fg · borders — the dark-theme backbone</div>
  </div>
  <div class="swatches">
    <div class="sw"><div class="chip" style="background:#f8fafc"></div><div class="step">50</div><div class="hex">F8FAFC</div></div>
    <div class="sw"><div class="chip" style="background:#f1f5f9"></div><div class="step">100</div><div class="hex">F1F5F9</div></div>
    <div class="sw"><div class="chip" style="background:#e2e8f0"></div><div class="step">200</div><div class="hex">E2E8F0</div></div>
    <div class="sw"><div class="chip" style="background:#cbd5e1"></div><div class="step">300</div><div class="hex">CBD5E1</div></div>
    <div class="sw"><div class="chip" style="background:#94a3b8"></div><div class="step">400</div><div class="hex">94A3B8</div></div>
    <div class="sw"><div class="chip" style="background:#64748b"></div><div class="step">500</div><div class="hex">64748B</div></div>
    <div class="sw"><div class="chip" style="background:#475569"></div><div class="step">600</div><div class="hex">475569</div></div>
    <div class="sw"><div class="chip" style="background:#334155"></div><div class="step">700</div><div class="hex">334155</div></div>
    <div class="sw"><div class="chip" style="background:#1e293b"></div><div class="step">800</div><div class="hex">1E293B</div></div>
    <div class="sw"><div class="chip" style="background:#0f172a"></div><div class="step">900</div><div class="hex">0F172A</div></div>
    <div class="sw"><div class="chip" style="background:#020617"></div><div class="step">950</div><div class="hex">020617</div></div>
  </div>
</div>
</body>
</html>
