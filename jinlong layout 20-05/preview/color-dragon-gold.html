<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{display:flex;justify-content:center}
  .card{width:700px;box-sizing:border-box;padding:28px 32px;background:var(--bg-page);color:var(--fg-1);border-radius:16px;overflow:hidden;position:relative}
  .swatches{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
  .sw{display:flex;flex-direction:column;align-items:stretch;gap:6px}
  .chip{height:64px;border-radius:8px;border:1px solid rgba(255,255,255,0.06)}
  .step{font-family:var(--font-numeric);font-size:11px;font-weight:600;color:var(--fg-2);text-align:center}
  .hex{font-family:var(--font-numeric);font-size:10px;color:var(--fg-3);text-align:center;letter-spacing:0.02em}
  .heading{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
  .title{font-size:15px;font-weight:600;letter-spacing:-0.005em}
  .role{font-size:12px;color:var(--fg-3)}
  .star{color:var(--accent);margin-left:4px}
</style>
</head>
<body>
<div class="card">
  <div class="heading">
    <div class="title">Dragon Gold</div>
    <div class="role">Accent · CTAs · totals · brand wordmark</div>
  </div>
  <div class="swatches">
    <div class="sw"><div class="chip" style="background:#fffbeb"></div><div class="step">50</div><div class="hex">#FFFBEB</div></div>
    <div class="sw"><div class="chip" style="background:#fef3c7"></div><div class="step">100</div><div class="hex">#FEF3C7</div></div>
    <div class="sw"><div class="chip" style="background:#fde68a"></div><div class="step">200</div><div class="hex">#FDE68A</div></div>
    <div class="sw"><div class="chip" style="background:#fcd34d"></div><div class="step">300</div><div class="hex">#FCD34D</div></div>
    <div class="sw"><div class="chip" style="background:#fbbf24;outline:2px solid var(--accent);outline-offset:-3px"></div><div class="step">400 <span class="star">★</span></div><div class="hex">#FBBF24</div></div>
    <div class="sw"><div class="chip" style="background:#f59e0b;outline:2px solid var(--accent);outline-offset:-3px"></div><div class="step">500 <span class="star">★</span></div><div class="hex">#F59E0B</div></div>
    <div class="sw"><div class="chip" style="background:#d97706"></div><div class="step">600</div><div class="hex">#D97706</div></div>
    <div class="sw"><div class="chip" style="background:#b45309"></div><div class="step">700</div><div class="hex">#B45309</div></div>
    <div class="sw"><div class="chip" style="background:#78350f"></div><div class="step">900</div><div class="hex">#78350F</div></div>
  </div>
</div>
</body>
</html>
